function ppInfo(type) {
  const i = PP_INFO[type];
  if (i) return { name: i[0], colour: i[1], icon: i[2], desc: i[3] };
  return { name: `POWER PLAY #${type}`, colour: '#AB47BC', icon: null, desc: 'A mystery power play' };
}

function ppType(pp) {
  if (pp.PowerType != null && pp.PowerType !== -1) return pp.PowerType;
  const t = (pp.PowerTypes || []).filter((x) => x !== -1);
  if (t.length === 2) {
    const k = t.slice().sort((a, b) => a - b).join(',');
    if (k === '4,7') return 10;
    if (k === '4,5') return 11;
    if (k === '6,7') return 12;
  }
  return t.length ? t[0] : -1;
}

function ppIcon(info) {
  const ic = info.icon ? icon(info.icon) : null;
  return ic || h('div', { style: { fontSize: '54px', fontWeight: '900', color: '#fff', textShadow: 'var(--shadow)' }, text: '?' });
}

Screens.powerplay = {
  game: true,
  mount(ctx) {
    const { scope } = ctx;
    const msg = ctx.msg;
    const plays = (msg.PowerPlays || []).filter((pp) => ppType(pp) !== -1);
    const players = msg.PowerPlayPlayers || [];
    let selected = null;
    let committed = !!ctx.sent('ClientPowerPlayChoice');
    let targeting = false;
    let pending = 0;

    const title = h('div', { class: 'pp-title', text: 'PICK A POWER PLAY' });
    const strip = h('div', { class: 'pp-strip' });
    const label = h('div', { class: 'pp-label hidden' });
    const desc = h('div', { class: 'pp-desc-main' });
    const targets = h('div', { class: 'pp-targets hidden' });
    const back = h('div', { class: 'pp-back hidden' });
    const el = h('div', {}, sunburst('#E8A040', '#D08830'),
      h('div', { class: 'layer center', style: { justifyContent: 'flex-start' } }, title, strip, label, desc, targets),
      back);

    const setTitle = (text) => {
      title.style.opacity = '0';
      scope.timeout(() => { title.textContent = text; title.style.opacity = '1'; }, 200);
    };

    function card(pp, animate) {
      const type = ppType(pp);
      const info = ppInfo(type);
      const iconBox = h('div', { class: 'pp-icon', style: { background: info.colour } }, ppIcon(info));
      const name = h('div', { class: 'pp-name', text: info.name });
      const d = h('div', { class: 'pp-desc', text: info.desc });
      const el2 = h('button', { class: 'pp-card' }, iconBox, h('div', { class: 'pp-name-wrap' }, name), d);
      el2.addEventListener('click', (e) => {
        e.stopPropagation();
        if (committed) return;
        if (targeting) { stepBack(); return; }
        if (!selected) select(pp);
      });
      if (animate) reel(type, iconBox, name, d);
      return el2;
    }

    // Slot-machine reveal for power plays that are new this round.
    function reel(real, iconBox, name, d) {
      const others = shuffle(PP_DECOYS.filter((t) => t !== real));
      const types = PP_REEL.map((_, i) => others[i % others.length]).concat([real]);
      const show = (t) => {
        const info = ppInfo(t);
        iconBox.style.background = info.colour;
        iconBox.replaceChildren(ppIcon(info));
        return info;
      };
      name.textContent = show(types[0]).name;
      d.textContent = '';
      let at = 300;
      for (let i = 1; i < types.length; i++) {
        const t = types[i];
        const last = i === types.length - 1;
        const spin = i < PP_REEL.length ? PP_REEL[i] * 0.4 : 100;
        scope.timeout(() => {
          const info = show(t);
          Sound.play('tick');
          name.style.transition = `transform ${spin}ms, opacity ${spin}ms`;
          name.style.transform = 'translateY(32px)';
          name.style.opacity = '0';
          scope.timeout(() => {
            name.style.transition = 'none';
            name.style.transform = 'translateY(-32px)';
            name.textContent = info.name;
            void name.offsetWidth;
            name.style.transition = `transform ${spin}ms, opacity ${spin}ms`;
            name.style.transform = 'translateY(0)';
            name.style.opacity = '1';
            if (last) {
              scope.timeout(() => {
                Sound.play('reveal');
                d.textContent = info.desc;
                d.style.opacity = '0';
                d.style.transition = 'opacity 200ms';
                void d.offsetWidth;
                d.style.opacity = '1';
                name.style.transition = 'transform 120ms';
                name.style.transform = 'scale(1.3)';
                iconBox.style.transform = 'scale(1.2)';
                scope.timeout(() => { name.style.transform = 'scale(1)'; iconBox.style.transform = 'scale(1)'; }, 120);
              }, spin);
            }
          }, spin);
        }, at);
        at += i < PP_REEL.length ? PP_REEL[i] : 400;
      }
    }

    function picker(animate) {
      clearTimeout(pending);
      targeting = false;
      selected = null;
      title.textContent = 'PICK A POWER PLAY';
      title.style.opacity = '1';
      label.classList.add('hidden');
      desc.textContent = '';
      desc.classList.remove('hidden');
      targets.classList.add('hidden');
      targets.replaceChildren();
      back.classList.add('hidden');
      strip.classList.remove('peek');
      strip.style.transform = '';
      strip.style.opacity = '1';
      strip.replaceChildren(...plays.map((pp) => card(pp, animate && pp.New)));
    }

    function select(pp) {
      selected = pp;
      const info = ppInfo(ppType(pp));
      Sound.play('select');
      label.textContent = info.name;
      label.classList.remove('hidden');
      desc.textContent = info.desc;
      setTitle(pp.TargetCount > 1 ? info.name : 'CHOOSE A TARGET');
      strip.style.transition = 'transform 300ms, opacity 300ms';
      strip.style.transform = 'scale(0.8)';
      strip.style.opacity = '0.4';
      pending = scope.timeout(() => {
        targeting = true;
        strip.style.transition = '';
        strip.style.transform = '';
        strip.classList.add('peek');
        label.classList.add('hidden');
        desc.classList.add('hidden');
        back.classList.remove('hidden');
        showTargets(pp);
      }, 300);
    }

    function stepBack() {
      if (!targeting || committed) return;
      Sound.play('tap');
      picker(false);
    }
    back.addEventListener('click', stepBack);
    strip.addEventListener('click', () => { if (targeting) stepBack(); });

    function targetCard(nameText, photoEl, onPick) {
      const spot = h('div', { class: 'pp-spot' });
      const ring = h('div', { class: 'pp-ring' });
      const photo = h('div', { class: 'pp-photo' }, photoEl);
      const c = h('button', { class: 'pp-target' }, h('div', { class: 'pp-photo-wrap' }, spot, ring, photo), h('div', { class: 'nm', text: nameText }));
      c.parts = { spot, ring, photo };
      c.addEventListener('click', (e) => { e.stopPropagation(); onPick(c); });
      return c;
    }

    function showTargets(pp) {
      targets.classList.remove('hidden');
      targets.style.opacity = '0';
      targets.style.transition = 'opacity 300ms';
      void targets.offsetWidth;
      targets.style.opacity = '1';
      targets.replaceChildren();
      const info = ppInfo(ppType(pp));
      if (pp.TargetCount > 1) {
        const ic = h('div', { style: { width: '100%', height: '100%', background: info.colour, display: 'flex', alignItems: 'center', justifyContent: 'center' } }, ppIcon(info));
        targets.append(targetCard('Everyone', ic, (c) => commit(pp, pp.PowerPlayTargets || [], c, true)));
        return;
      }
      const list = players.filter((p) => (pp.PowerPlayTargets || []).includes(p.SlotIndex));
      for (const p of list) {
        const url = S.images.get(p.ImageGUID);
        const ph = url ? h('img', { src: url, alt: '' }) : null;
        const c = targetCard(p.Name, ph, (cc) => commit(pp, [p.SlotIndex], cc, false));
        if (!url) c.parts.photo.style.background = 'rgba(255,255,255,0.5)';
        targets.append(c);
      }
    }

    function commit(pp, slots, c, everyone) {
      if (committed) return;
      committed = true;
      targeting = false;
      back.classList.add('hidden');
      sendPowerPlayChoice(pp.DisplayIndex, slots);
      Sound.play('power');
      Sound.vibrate([20, 30, 40]);
      lockedIn(c, everyone);
    }

    function lockedIn(c, everyone) {
      for (const other of targets.children) if (other !== c) other.style.opacity = '0.3';
      if (c) {
        c.parts.ring.classList.add('on');
        if (!everyone) {
          c.parts.spot.classList.add('on');
          c.parts.photo.style.transform = 'scale(1.05)';
        }
      }
      desc.textContent = '✓ Locked in!';
      desc.classList.remove('hidden');
    }

    const prior = ctx.sent('ClientPowerPlayChoice');
    if (prior && prior.PowerPlaySlotIndex >= 0) {
      const pp = plays.find((x) => x.DisplayIndex === prior.PowerPlaySlotIndex);
      picker(false);
      if (pp) {
        const info = ppInfo(ppType(pp));
        title.textContent = pp.TargetCount > 1 ? info.name : 'CHOOSE A TARGET';
        strip.classList.add('peek');
        showTargets(pp);
        const idx = pp.TargetCount > 1 ? 0 : players.filter((p) => (pp.PowerPlayTargets || []).includes(p.SlotIndex)).findIndex((p) => (prior.TargetSlotIndex || []).includes(p.SlotIndex));
        lockedIn(targets.children[idx] || null, pp.TargetCount > 1);
      }
    } else {
      picker(!ctx.restored);
      if (prior) {
        desc.textContent = "Time's up";
        strip.style.opacity = '0.4';
      }
    }

    if (!committed && ctx.got('ServerRequestPowerPlayChoice')) {
      committed = true;
      sendPowerPlayChoice(-1, []);
      desc.textContent = "Time's up";
    }

    return {
      el,
      onMsg(m, type) {
        if (type === 'ServerRequestPowerPlayChoice') {
          if (!committed) {
            committed = true;
            sendPowerPlayChoice(-1, []);
            back.classList.add('hidden');
          }
          return true;
        }
        return false;
      },
    };
  },
};

// Shared pieces for the drag-to-link screens.
let stripePattern = null;
function linkStripe(ctx) {
  if (!stripePattern) {
    const c = document.createElement('canvas');
    c.width = 20;
    c.height = 20;
    const g = c.getContext('2d');
    for (let y = 0; y < 20; y++) {
      for (let x = 0; x < 20; x++) {
        g.fillStyle = Math.floor((x + y) / 10) % 2 === 0 ? '#FFFFFF' : '#66CCDD';
        g.fillRect(x, y, 1, 1);
      }
    }
    stripePattern = c;
  }
  return ctx.createPattern(stripePattern, 'repeat');
}

function drawLinkPath(ctx, pts) {
  if (pts.length < 2) return;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const [style, w] of [['#2299AA', 24], [linkStripe(ctx), 18]]) {
    ctx.strokeStyle = style;
    ctx.lineWidth = w;
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.stroke();
  }
}

function placeSlot(el, { w, hh, left, right, top, bottom, centerX, rot = 0, k = 1 }) {
  Object.assign(el.style, {
    width: `${w * k}px`, height: `${hh * k}px`,
    left: left != null ? `${left * k}px` : centerX ? `calc(50% - ${(w * k) / 2}px)` : '',
    right: right != null ? `${right * k}px` : '',
    top: top != null ? `${top * k}px` : '',
    bottom: bottom != null ? `${bottom * k}px` : '',
    transform: rot ? `rotate(${rot}deg)` : '',
    fontSize: `${16 * Math.max(0.8, k)}px`,
  });
}

// Centre and rotation of a slot, relative to the screen element.
function slotGeom(slot, root) {
  const r = rectOf(slot, root);
  return { cx: r.x + r.w / 2, cy: r.y + r.h / 2, w: slot.offsetWidth, h: slot.offsetHeight, rot: slot.rot || 0 };
}

function inSlot(p, g, pad = 8) {
  const a = (-g.rot * Math.PI) / 180;
  const dx = p.x - g.cx;
  const dy = p.y - g.cy;
  const x = dx * Math.cos(a) - dy * Math.sin(a);
  const y = dx * Math.sin(a) + dy * Math.cos(a);
  return Math.abs(x) <= g.w / 2 + pad && Math.abs(y) <= g.h / 2 + pad;
}

function minigameFrame(colours) {
  const bg = sunburst(...colours);
  const counter = counterPill();
  const feedback = feedbackBubble();
  const el = h('div', {}, bg, whirlpool(), counter);
  return { el, bg, counter, feedback };
}

const scaleFor = (el, w, hh) => Math.min(1, el.clientWidth / w, el.clientHeight / hh);

// ---------------------------------------------------------------- linking pairs (KIP)
Screens.pairs = {
  game: true,
  duration: (m) => m.QuestionDuration || 0,
  answerType: 'ClientLinkingAnswer',
  mount(ctx) {
    const { scope } = ctx;
    const msg = ctx.msg;
    const f = minigameFrame(PINK);
    Object.assign(f.counter.style, { top: '50%', transform: 'translate(-50%, calc(-50% - 44px))' });
    const hint = h('div', { class: 'hint mg-hint', style: { top: '50%', transform: 'translate(-50%, -50%)' }, text: 'Drag to link answers' });
    const canvas = hiCanvas('link-canvas');
    const POS = [
      [{ left: 20, top: 24, rot: -12 }, { right: 20, top: 16, rot: 12 }, { centerX: true, top: 20, rot: 3 }],
      [{ left: 60, bottom: 24, rot: 8 }, { right: 20, bottom: 16, rot: -8 }, { centerX: true, bottom: 20, rot: -3 }],
    ];
    const mk = (cls) => h('div', { class: `slot ${cls}`, style: { position: 'absolute' } });
    const topEls = [0, 1, 2].map(() => mk('dome-top'));
    const botEls = [0, 1, 2].map(() => mk('dome-bottom'));
    f.el.append(...topEls, hint, ...botEls, f.feedback, canvas);

    const all = (msg.LinkingAnswers || []).slice().sort((a, b) => a.MatchIndex - b.MatchIndex);
    const topQ = all.filter((a) => a.Direction === 1);
    const botQ = all.filter((a) => a.Direction === 2);
    const totalPairs = Math.min(topQ.length, botQ.length);
    const activeTop = [null, null, null];
    const activeBot = [null, null, null];
    const attempts = [];
    let correct = 0;
    let sent = !!ctx.sent('ClientLinkingAnswer');
    let drag = null;
    let fbTimer = 0;

    const key = (id) => {
      const s2 = String(id);
      const i = s2.indexOf('Answer');
      if (i < 0) return s2;
      const after = s2.slice(i + 6);
      return after.length >= 2 ? after.slice(1) : s2;
    };

    function fillRow(slots, q) {
      const toFill = Math.min(3 - slots.filter(Boolean).length, q.length);
      const empty = shuffle(slots.map((x, i) => (x ? -1 : i)).filter((i) => i >= 0));
      for (let i = 0; i < toFill; i++) slots[empty[i]] = q.shift();
    }
    function ensureMatch() {
      const tk = new Set(activeTop.filter(Boolean).map((a) => key(a.AnswerID)));
      const bk = new Set(activeBot.filter(Boolean).map((a) => key(a.AnswerID)));
      for (const k2 of tk) if (bk.has(k2)) return;
      for (const t of activeTop.filter(Boolean)) {
        const mi = botQ.findIndex((b) => key(b.AnswerID) === key(t.AnswerID));
        if (mi >= 0) {
          const m = botQ.splice(mi, 1)[0];
          let si = activeBot.findIndex(Boolean);
          if (si < 0) si = activeBot.findIndex((x) => !x);
          if (activeBot[si]) botQ.push(activeBot[si]);
          activeBot[si] = m;
          return;
        }
      }
      for (const b of activeBot.filter(Boolean)) {
        const mi = topQ.findIndex((t) => key(t.AnswerID) === key(b.AnswerID));
        if (mi >= 0) {
          const m = topQ.splice(mi, 1)[0];
          let si = activeTop.findIndex(Boolean);
          if (si < 0) si = activeTop.findIndex((x) => !x);
          if (activeTop[si]) topQ.push(activeTop[si]);
          activeTop[si] = m;
          return;
        }
      }
      send();
    }
    function fillSlots() {
      fillRow(activeTop, topQ);
      fillRow(activeBot, botQ);
      ensureMatch();
    }
    function send() {
      if (sent) return;
      sent = true;
      App.send({ TypeString: `${KIP}ClientLinkingAnswer`, ClientLinkingCorrectAnswerCount: correct, ClientAnswers: attempts.slice() });
    }
    function updateUI() {
      const set = (els, items) => els.forEach((e, i) => {
        e.textContent = items[i] ? items[i].DisplayText : '';
        e.style.visibility = items[i] ? 'visible' : 'hidden';
      });
      set(topEls, activeTop);
      set(botEls, activeBot);
      const left = totalPairs - correct;
      f.counter.set(left > 0 && !sent ? left : null);
      hint.textContent = left > 0 && !sent ? 'Drag to link answers' : 'Done, waiting for other players';
      if (sent && left > 0) { topEls.concat(botEls).forEach((e) => { e.style.visibility = 'hidden'; }); }
    }
    function layout() {
      const k = scaleFor(f.el, 700, 360);
      [topEls, botEls].forEach((els, row) => els.forEach((e, i) => {
        placeSlot(e, { w: 200, hh: 100, k, ...POS[row][i] });
        e.rot = POS[row][i].rot;
      }));
      canvas.fit();
    }
    function redraw(pts) {
      const g = canvas.ctx;
      if (!g) return;
      g.clearRect(0, 0, canvas.cw, canvas.ch);
      if (pts) drawLinkPath(g, pts);
    }
    function feedback(a, b, ok) {
      clearTimeout(fbTimer);
      f.bg.setColors(...(ok ? TEAL : ROSE));
      f.feedback.show(a, b, ok ? TEAL[0] : ROSE[0]);
      fbTimer = scope.timeout(() => {
        f.feedback.hide();
        f.bg.setColors(...PINK);
      }, 500);
    }
    function processMatch(ti, bi) {
      const t = activeTop[ti];
      const b = activeBot[bi];
      const ok = key(t.AnswerID) === key(b.AnswerID);
      attempts.push({ FromID: t.AnswerID, ToID: b.AnswerID, Correct: ok });
      if (ok) {
        correct++;
        Sound.play('correct');
        feedback(t.DisplayText, b.DisplayText, true);
        activeTop[ti] = null;
        activeBot[bi] = null;
        scope.timeout(() => {
          fillSlots();
          updateUI();
          if (correct >= totalPairs) send();
          updateUI();
        }, 500);
      } else {
        Sound.play('wrong');
        Sound.vibrate(30);
        feedback(t.DisplayText, b.DisplayText, false);
      }
    }

    const at = (els, items, p) => els.findIndex((e, i) => items[i] && inSlot(p, slotGeom(e, f.el)));
    onDrag(scope, canvas, {
      relativeTo: f.el,
      start(p) {
        if (sent) return false;
        const ti = at(topEls, activeTop, p);
        if (ti < 0) return false;
        const g = slotGeom(topEls[ti], f.el);
        drag = { ti, pts: [{ x: g.cx, y: g.cy }] };
        Sound.play('link');
        redraw(drag.pts);
        return true;
      },
      move(p) {
        if (!drag) return;
        drag.pts.push(p);
        redraw(drag.pts);
      },
      end(p, cancelled) {
        const d = drag;
        drag = null;
        redraw(null);
        if (!d || cancelled || sent) return;
        const bi = at(botEls, activeBot, p);
        if (bi >= 0 && activeTop[d.ti] && activeBot[bi]) processMatch(d.ti, bi);
      },
    });

    if (!sent) {
      fillSlots();
      scope.timeout(send, ctx.remainingMs(msg.QuestionDuration || 0));
    }
    updateUI();
    scope.resize(f.el, layout);
    return { el: f.el, ready: layout };
  },
};

// ---------------------------------------------------------------- linking chain / ordering (Decades)
Screens.chain = {
  game: true,
  duration: (m) => m.QuestionDuration || 0,
  answerType: 'ClientToServerOrderingAnswer',
  mount(ctx) {
    const { scope } = ctx;
    const msg = ctx.msg;
    const f = minigameFrame(PINK);
    const hint = h('div', { class: 'hint mg-hint', style: { top: '50%', transform: 'translate(-50%, -50%)' }, text: 'Drag to link in order' });
    const canvas = hiCanvas('link-canvas');
    const POS = [
      { left: 16, top: 40 }, { right: 16, top: 32 }, { centerX: true, bottom: 40 }, { left: 8, bottom: 32 }, { right: 8, bottom: 32 },
    ];
    const slotEls = POS.map(() => h('div', { class: 'slot circle', style: { position: 'absolute' } }));
    f.el.append(...slotEls, hint, f.feedback, canvas);

    const rounds = (msg.OrderingAnswerData || []).map((d, mi) => (d.WordsInCorrectOrder || []).map((word, dir) => ({ DisplayText: word, AnswerID: `ORD_${mi}_${dir}` })));
    let round = 0;
    let correct = 0;
    let sent = !!ctx.sent('ClientToServerOrderingAnswer');
    let slots = [];
    let chain = [];
    let segs = [];
    let live = null;
    let locked = false;

    const send = () => {
      if (sent) return;
      sent = true;
      App.send({ TypeString: `${KIP}ClientToServerOrderingAnswer`, ClientOrderingCorrectAnswerCount: correct });
    };
    function show() {
      chain = [];
      segs = [];
      live = null;
      if (round >= rounds.length) return;
      slots = shuffle(rounds[round]).slice(0, 5);
      slotEls.forEach((e, i) => {
        const it = slots[i];
        e.classList.toggle('hidden', !it);
        e.textContent = it ? it.DisplayText : '';
        e.style.background = '#F0EAD6';
        if (it) scope.timeout(() => fitText(e, 16 * (e.k || 1), 10), 0);
      });
      f.counter.set(rounds.length - round);
      redraw();
    }
    function highlight() {
      slotEls.forEach((e, i) => { e.style.background = chain.includes(i) ? '#B2DFDB' : '#F0EAD6'; });
    }
    function centre(i) {
      const g = slotGeom(slotEls[i], f.el);
      return { x: g.cx, y: g.cy };
    }
    function redraw() {
      const g = canvas.ctx;
      if (!g) return;
      g.clearRect(0, 0, canvas.cw, canvas.ch);
      for (const s2 of segs) drawLinkPath(g, s2);
      if (live) drawLinkPath(g, live);
    }
    function reset() {
      chain = [];
      segs = [];
      live = null;
      highlight();
      redraw();
    }
    const order = () => rounds[round] || [];
    function complete() {
      live = null;
      locked = true;
      redraw();
      Sound.play('correct');
      f.bg.setColors(...TEAL);
      f.feedback.show(order().map((x) => x.DisplayText).join(' '), '', TEAL[0]);
      scope.timeout(() => {
        f.feedback.hide();
        f.bg.setColors(...PINK);
        locked = false;
        correct++;
        round++;
        f.counter.set(rounds.length - round);
        if (round >= rounds.length) send();
        else show();
      }, 600);
    }
    const slotAt = (p) => slotEls.findIndex((e, i) => slots[i] && !e.classList.contains('hidden') && inSlot(p, { ...slotGeom(e, f.el), rot: 0 }, 0));

    onDrag(scope, canvas, {
      relativeTo: f.el,
      start(p) {
        if (locked || round >= rounds.length) return false;
        const i = slotAt(p);
        if (i < 0 || chain.length || slots[i].AnswerID !== order()[0].AnswerID) return false;
        chain.push(i);
        highlight();
        Sound.play('link');
        if (chain.length === slots.length) { complete(); return false; }
        live = [centre(i)];
        redraw();
        return true;
      },
      move(p) {
        if (!live || locked) return;
        live.push(p);
        const i = slotAt(p);
        if (i >= 0 && !chain.includes(i)) {
          if (slots[i].AnswerID === order()[chain.length].AnswerID) {
            const c = centre(i);
            live.push(c);
            segs.push(live);
            chain.push(i);
            highlight();
            Sound.play('snap');
            Sound.vibrate(8);
            live = [c];
            if (chain.length === slots.length) complete();
          } else {
            live = null;
            locked = true;
            Sound.play('wrong');
            Sound.vibrate(30);
            f.bg.setColors(...ROSE);
            scope.timeout(() => {
              f.bg.setColors(...PINK);
              locked = false;
              reset();
            }, 400);
          }
        }
        redraw();
      },
      end() {
        if (!locked && round < rounds.length && chain.length < slots.length) reset();
        live = null;
        redraw();
      },
    });

    function layout() {
      const k = scaleFor(f.el, 640, 380);
      slotEls.forEach((e, i) => {
        placeSlot(e, { w: 144, hh: 144, k, ...POS[i] });
        e.k = k;
        e.style.fontSize = `${16 * k}px`;
        if (slots[i]) fitText(e, 16 * k, 10);
      });
      canvas.fit();
      redraw();
    }

    if (sent) {
      slotEls.forEach((e) => e.classList.add('hidden'));
      hint.textContent = 'Done, waiting for other players';
      f.counter.set(null);
    } else {
      show();
      scope.timeout(send, ctx.remainingMs(msg.QuestionDuration || 0));
    }
    scope.resize(f.el, layout);
    return { el: f.el, ready: layout };
  },
};

// ---------------------------------------------------------------- sorting (KIP)
Screens.sorting = {
  game: true,
  duration: (m) => m.QuestionDuration || 0,
  answerType: 'ClientSortingAnswer',
  mount(ctx) {
    const { scope } = ctx;
    const msg = ctx.msg;
    const f = minigameFrame(PINK);
    const q = h('div', { class: 'hint', style: { position: 'absolute', top: '48px', left: '50%', transform: 'translateX(-50%)', fontSize: '14px', zIndex: '3', maxWidth: '70%', textAlign: 'center' }, text: msg.QuestionText || '' });
    const left = h('div', { class: 'bucket left', text: msg.LeftBucketLabel || '' });
    const right = h('div', { class: 'bucket right', text: msg.RightBucketLabel || '' });
    const item = h('div', { class: 'sort-item' });
    f.el.append(q, left, right, item, f.feedback);

    const queue = shuffle(msg.SortingAnswers || []);
    const attempts = [];
    let current = null;
    let correct = 0;
    let sent = !!ctx.sent('ClientSortingAnswer');
    let start = null;

    const send = () => {
      if (sent) return;
      sent = true;
      App.send({ TypeString: `${KIP}ClientSortingAnswer`, ClientSortingCorrectAnswerCount: correct, SortingAnswers: attempts.slice() });
    };
    function next() {
      current = queue.shift() || null;
      item.style.transition = 'none';
      item.style.transform = '';
      item.style.visibility = current ? 'visible' : 'hidden';
      item.textContent = current ? current.DisplayText : '';
      if (current) fitText(item, 18, 10);
      const leftCount = queue.length + (current ? 1 : 0);
      f.counter.set(leftCount > 0 ? leftCount : null);
    }
    function sortInto(bucketId) {
      const it = current;
      const correctId = it.AnswerDirection === 1 ? msg.LeftBucketID : msg.RightBucketID;
      const ok = bucketId === correctId;
      attempts.push({ AnswerID: it.AnswerID, AnswerBucketID: bucketId, Correct: ok });
      if (ok) correct++;
      Sound.play(ok ? 'correct' : 'wrong');
      if (!ok) Sound.vibrate(30);
      f.bg.setColors(...(ok ? TEAL : ROSE));
      f.feedback.show(it.DisplayText, '', ok ? TEAL[0] : ROSE[0]);
      item.style.visibility = 'hidden';
      current = null;
      scope.timeout(() => {
        f.feedback.hide();
        f.bg.setColors(...PINK);
        next();
        if (!current && !queue.length) send();
      }, 400);
    }

    onDrag(scope, item, {
      relativeTo: f.el,
      start(p) {
        if (!current) return false;
        start = p;
        item.style.transition = 'transform 100ms';
        item.style.transform = 'scale(1.1)';
        Sound.play('tap');
        return true;
      },
      move(p) {
        if (!start) return;
        item.style.transition = 'none';
        item.style.transform = `translate(${p.x - start.x}px, ${p.y - start.y}px) scale(1.1)`;
      },
      end(p, cancelled) {
        if (!start || !current) return;
        const dx = p.x - start.x;
        start = null;
        const cx = f.el.clientWidth / 2 + dx;
        if (!cancelled && cx < left.offsetLeft + left.offsetWidth) { sortInto(msg.LeftBucketID); return; }
        if (!cancelled && cx > right.offsetLeft) { sortInto(msg.RightBucketID); return; }
        item.style.transition = 'transform 200ms';
        item.style.transform = '';
      },
    });

    if (sent) {
      item.style.visibility = 'hidden';
      f.counter.set(null);
    } else {
      next();
      scope.timeout(send, ctx.remainingMs(msg.QuestionDuration || 0));
    }
    return { el: f.el };
  },
};

// Decades round types: elimination, matching (hex column) and missing letter.
function decadesFrame(questionText, top, size, instruction) {
  const f = minigameFrame(PINK);
  const q = h('div', { class: 'mg-q', style: { top: `${top}px`, fontSize: `${size}px` }, text: questionText || '' });
  const overlay = h('div', { class: 'full hidden', style: { background: 'rgba(255,0,0,0.376)', zIndex: '8' } });
  const hint = instruction ? h('div', { class: 'hint mg-hint', style: { bottom: '24px' }, text: instruction }) : null;
  f.el.append(q, overlay);
  if (hint) f.el.append(hint);
  return { ...f, q, overlay, hint };
}

function roundsGame(ctx, { total, send }) {
  const state = { round: 0, correct: 0, sent: false, penalty: false, locked: false };
  state.send = () => {
    if (state.sent) return;
    state.sent = true;
    send(state.correct);
  };
  if (!total) state.send();
  else ctx.scope.timeout(state.send, ctx.remainingMs(ctx.msg.QuestionDuration || 0));
  return state;
}

// ---------------------------------------------------------------- elimination
Screens.elimination = {
  game: true,
  duration: (m) => m.QuestionDuration || 0,
  answerType: 'ClientToServerEliminatingAnswer',
  mount(ctx) {
    const { scope, msg } = ctx;
    const f = decadesFrame(msg.QuestionText, 40, 16, 'Tap to smash odd one out');
    const rounds = msg.EliminatingAnswerData || [];
    const btns = [0, 1, 2].map(() => h('button', { class: 'elim-btn' }));
    f.el.append(h('div', { class: 'elim-row' }, ...btns.map((b) => h('div', {}, b))));
    if (ctx.sent('ClientToServerEliminatingAnswer')) {
      btns.forEach((b) => { b.style.visibility = 'hidden'; });
      f.hint.textContent = 'Done, waiting for other players';
      return { el: f.el };
    }
    const st = roundsGame(ctx, {
      total: rounds.length,
      send: (n) => App.send({ TypeString: `${KIP}ClientToServerEliminatingAnswer`, AnswerCount: n }),
    });

    function display() {
      const r = rounds[st.round];
      const answers = shuffle([r.CorrectAnswer, ...(r.IncorrectAnswers || []).slice(0, 2)]);
      btns.forEach((b, i) => {
        const text = answers[i];
        b.style.visibility = text == null ? 'hidden' : 'visible';
        b.textContent = text ?? '';
        b.style.opacity = '1';
        b.style.background = 'var(--eggshell)';
        b.disabled = false;
        b.correct = text === r.CorrectAnswer;
        scope.timeout(() => fitText(b, 14, 9), 0);
      });
      f.counter.set(rounds.length - st.round);
    }
    btns.forEach((b) => b.addEventListener('click', () => {
      if (st.sent || st.penalty || st.locked || b.disabled) return;
      if (b.correct) {
        st.correct++;
        st.locked = true;
        b.style.background = TEAL[0];
        btns.forEach((x) => { x.disabled = true; });
        Sound.play('shatter');
        Sound.vibrate(15);
        scope.timeout(() => {
          st.locked = false;
          st.round++;
          if (st.round >= rounds.length) st.send();
          else display();
        }, 400);
      } else {
        st.penalty = true;
        b.style.background = ROSE[0];
        b.style.opacity = '0.5';
        b.disabled = true;
        f.overlay.classList.remove('hidden');
        Sound.play('wrong');
        Sound.vibrate([40, 30, 40]);
        scope.timeout(() => {
          f.overlay.classList.add('hidden');
          st.penalty = false;
        }, 800);
      }
    }));
    if (rounds.length) display();
    return { el: f.el };
  },
};

// ---------------------------------------------------------------- matching
const HEX_ACCENTS = ['#66BB6A', '#42A5F5', '#FF8A65', '#AB47BC', '#FFCA28', '#EC407A'];
const HEX_BODY = { normal: '#9C27B0', correct: TEAL[0], wrong: ROSE[0] };

Screens.matching = {
  game: true,
  duration: (m) => m.QuestionDuration || 0,
  answerType: 'ClientToServerMatchingAnswer',
  mount(ctx) {
    const { scope, msg } = ctx;
    const f = decadesFrame('', 40, 18, 'Swipe to find, tap to match');
    f.bg.setColors('#9C27B0', '#7B1FA2');
    const rounds = msg.MatchingData || [];
    const dummies = msg.DummyAnswerData || [];
    const hex = h('div', { class: 'hex' });
    const stage = h('div', { class: 'hex-stage' }, hex);
    f.el.insertBefore(stage, f.q);
    const faces = HEX_ACCENTS.map((acc) => {
      const label = h('span');
      const face = h('div', { class: 'hex-face' },
        h('div', { class: 'hex-screen' }, h('div', { class: 'hex-btn', style: { background: acc } }, label)),
        h('div', { class: 'hex-body' }));
      face.label = label;
      hex.append(face);
      return face;
    });
    const cap = h('div', { style: { position: 'absolute', background: '#70584F', filter: 'brightness(0.9)' } });
    hex.append(cap);

    let idx = 0;
    let rotation = 0;
    let faceW = 180;
    let answers = [];

    function setBody(c) {
      hex.style.setProperty('--hb', c);
      hex.style.setProperty('--hb2', shade(c, 0.75));
    }
    function shadeFaces() {
      faces.forEach((face, i) => {
        const dot = Math.cos(rotation + (i * Math.PI) / 3);
        face.style.filter = `brightness(${0.5 + 0.5 * clamp(dot, 0, 1)})`;
      });
    }
    function layout() {
      const avail = f.el.clientHeight - 150;
      const faceH = clamp(avail, 150, 300);
      faceW = Math.round(faceH / 1.29);
      const apothem = faceW * Math.cos(Math.PI / 6) / (2 * Math.sin(Math.PI / 6));
      Object.assign(hex.style, { width: `${faceW}px`, height: `${faceH}px` });
      faces.forEach((face, i) => {
        Object.assign(face.style, { width: `${faceW}px`, height: `${faceH}px`, transform: `rotateY(${i * 60}deg) translateZ(${apothem}px)` });
        face.label.style.fontSize = `${Math.round(faceW * 0.13)}px`;
      });
      const R = faceW;
      const pts = [0, 1, 2, 3, 4, 5].map((k) => {
        const a = ((30 + k * 60) * Math.PI) / 180;
        return `${50 + 50 * Math.sin(a)}% ${50 + 50 * Math.cos(a)}%`;
      });
      Object.assign(cap.style, { width: `${2 * R}px`, height: `${2 * R}px`, left: `${faceW / 2 - R}px`, top: `${-R}px`, transform: 'rotateX(90deg)', clipPath: `polygon(${pts.join(',')})` });
      faces.forEach((face) => scope.timeout(() => fitText(face.label, Math.round(faceW * 0.13), 10), 0));
    }
    function rotate() {
      hex.style.transform = `rotateX(-8deg) rotateY(${(rotation * 180) / Math.PI}deg)`;
      shadeFaces();
    }
    function display() {
      const r = rounds[st.round];
      f.q.textContent = r.QuestionText || '';
      const pool = dummies.filter((d) => d !== r.AnswerText);
      let fillers;
      if (pool.length >= 5) fillers = shuffle(pool).slice(0, 5);
      else if (pool.length) fillers = [0, 1, 2, 3, 4].map((k) => pool[k % pool.length]);
      else fillers = ['', '', '', '', ''];
      answers = shuffle([...fillers, r.AnswerText]);
      idx = 0;
      rotation = 0;
      hex.style.transition = 'none';
      rotate();
      void hex.offsetWidth;
      hex.style.transition = '';
      faces.forEach((face, i) => {
        face.classList.remove('pressed');
        face.label.textContent = answers[i];
        fitText(face.label, Math.round(faceW * 0.13), 10);
      });
      f.counter.set(rounds.length - st.round);
    }
    function step(dir) {
      idx = (idx + dir + 6) % 6;
      rotation -= (dir * Math.PI) / 3;
      Sound.play('whoosh');
      rotate();
    }
    function confirm() {
      if (st.round >= rounds.length) return;
      const r = rounds[st.round];
      const ok = answers[idx] === r.AnswerText;
      st.locked = true;
      faces[idx].classList.add('pressed');
      if (ok) {
        st.correct++;
        App.send({ TypeString: `${KIP}ClientToServerOngoingChallengeMessage`, CorrectAnswerCount: st.correct });
        f.bg.setColors(...TEAL);
        setBody(HEX_BODY.correct);
        Sound.play('correct');
        scope.timeout(() => {
          st.locked = false;
          st.round++;
          if (st.round >= rounds.length) { st.send(); return; }
          f.bg.setColors('#9C27B0', '#7B1FA2');
          setBody(HEX_BODY.normal);
          display();
        }, 500);
      } else {
        f.bg.setColors(...ROSE);
        setBody(HEX_BODY.wrong);
        Sound.play('wrong');
        Sound.vibrate(30);
        scope.timeout(() => {
          f.bg.setColors('#9C27B0', '#7B1FA2');
          setBody(HEX_BODY.normal);
          st.locked = false;
        }, 400);
      }
    }

    setBody(HEX_BODY.normal);
    if (ctx.sent('ClientToServerMatchingAnswer')) {
      stage.classList.add('hidden');
      f.hint.textContent = 'Done, waiting for other players';
      return { el: f.el };
    }
    const st = roundsGame(ctx, {
      total: rounds.length,
      send: (n) => App.send({ TypeString: `${KIP}ClientToServerMatchingAnswer`, ClientMatchingCorrectAnswerCount: n }),
    });

    let g = null;
    scope.on(stage, 'pointerdown', (e) => {
      Sound.unlock();
      g = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), consumed: false };
      try { stage.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    });
    scope.on(stage, 'pointermove', (e) => {
      if (!g || e.pointerId !== g.id || st.locked || st.sent || g.consumed) return;
      const dx = e.clientX - g.x;
      if (Math.abs(dx) > 40) {
        g.consumed = true;
        step(dx > 0 ? -1 : 1);
      }
    });
    const up = (e) => {
      if (!g || e.pointerId !== g.id) return;
      const gg = g;
      g = null;
      if (st.locked || st.sent || gg.consumed || e.type === 'pointercancel') return;
      const dx = e.clientX - gg.x;
      const dy = e.clientY - gg.y;
      const fast = performance.now() - gg.t < 250;
      if (fast && Math.abs(dx) >= 24) { step(dx > 0 ? -1 : 1); return; }
      if (Math.hypot(dx, dy) > 12) return;
      const r = faces[idx].querySelector('.hex-screen').getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) confirm();
    };
    scope.on(stage, 'pointerup', up);
    scope.on(stage, 'pointercancel', up);

    scope.resize(f.el, layout);
    if (rounds.length) display();
    return { el: f.el, ready: () => { layout(); rotate(); } };
  },
};

// ---------------------------------------------------------------- missing letter
Screens.missing = {
  game: true,
  duration: (m) => m.QuestionDuration || 0,
  answerType: 'PrototypeClientToServerMissingLetterAnswer',
  mount(ctx) {
    const { scope, msg } = ctx;
    const f = decadesFrame(msg.Question, 56, 20, null);
    const rounds = msg.MissingLetterAnswerData || [];
    const tiles = h('div', { class: 'tiles' });
    const btns = [0, 1, 2, 3, 4].map(() => h('button', { class: 'letter-btn' }));
    f.el.append(tiles, h('div', { class: 'letters' }, ...btns));
    if (ctx.sent('PrototypeClientToServerMissingLetterAnswer')) {
      btns.forEach((b) => b.classList.add('hidden'));
      f.counter.set(null);
      tiles.append(h('div', { class: 'hint', text: 'Done, waiting for other players' }));
      return { el: f.el };
    }
    const st = roundsGame(ctx, {
      total: rounds.length,
      send: (n) => App.send({ TypeString: `${KIP}PrototypeClientToServerMissingLetterAnswer`, ClientMissingLetterCorrectAnswerCount: n }),
    });

    function buildTiles() {
      const r = rounds[st.round];
      if (!r) return;
      const phrase = r.answerInfo || '';
      const missing = (r.correct || ' ')[0].toUpperCase();
      const width = Math.floor(f.el.clientWidth * 0.6);
      const perRow = clamp(Math.floor((phrase.length + 1) / 2), 4, 12);
      const size = Math.min(80, Math.floor((width - (perRow - 1) * 3) / perRow));
      Object.assign(tiles.style, { width: `${width}px`, gap: '3px' });
      tiles.replaceChildren(...[...phrase].map((ch) => {
        if (ch === ' ') return h('div', { style: { width: '10px', height: `${size}px` } });
        const blank = ch.toUpperCase() === missing;
        const revealed = blank && tiles.revealed;
        return h('div', {
          class: `tile${blank ? ' blank' : ''}${revealed ? ' revealed' : ''}`,
          style: { width: `${size}px`, height: `${size}px`, fontSize: `${Math.round(size * 0.45)}px` },
          text: blank && !revealed ? '' : blank ? missing : ch,
        });
      }));
    }
    function display() {
      const r = rounds[st.round];
      tiles.revealed = false;
      buildTiles();
      const letters = [...(r.letters || '')];
      btns.forEach((b, i) => {
        b.classList.toggle('hidden', i >= letters.length);
        b.textContent = letters[i] || '';
        b.style.opacity = '1';
        b.style.background = 'var(--eggshell)';
        b.disabled = false;
        b.correct = (letters[i] || '').toUpperCase() === String(r.correct || '').toUpperCase();
      });
      f.counter.set(rounds.length - st.round);
    }
    btns.forEach((b) => b.addEventListener('click', () => {
      if (st.sent || st.penalty || st.locked || b.disabled) return;
      if (b.correct) {
        st.correct++;
        st.locked = true;
        b.style.background = TEAL[0];
        btns.forEach((x) => { x.disabled = true; });
        tiles.revealed = true;
        buildTiles();
        Sound.play('reveal');
        Sound.vibrate(15);
        scope.timeout(() => {
          st.locked = false;
          st.round++;
          if (st.round >= rounds.length) st.send();
          else display();
        }, 400);
      } else {
        st.penalty = true;
        b.style.background = ROSE[0];
        b.style.opacity = '0.5';
        b.disabled = true;
        f.overlay.classList.remove('hidden');
        Sound.play('wrong');
        Sound.vibrate([40, 30, 40]);
        scope.timeout(() => {
          f.overlay.classList.add('hidden');
          st.penalty = false;
        }, 800);
      }
    }));
    scope.resize(f.el, buildTiles);
    if (rounds.length) display();
    return { el: f.el };
  },
};

// Install prompt. Android Chrome only offers its native prompt on HTTPS, so on the
// home network the banner explains the browser menu route instead.
const Install = {
  deferred: null,
  el: null,

  init() {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      this.deferred = e;
      this.render();
    });
    window.addEventListener('appinstalled', () => {
      store.set('installDismissed', true);
      this.hide();
    });
    setTimeout(() => this.render(), 2500);
  },

  shouldShow() {
    if (isStandalone()) return false;
    const dismissed = store.get('installDismissed');
    if (dismissed === true) return false;
    if (typeof dismissed === 'number' && Date.now() - dismissed < 3 * 86400000) return false;
    return isIOS() || isAndroid() || !!this.deferred;
  },

  text() {
    if (this.deferred) return { title: 'Install the controller', body: 'Add it to your home screen for full screen play.', button: 'Install' };
    if (isIOS()) {
      const share = '<svg class="share-ico" viewBox="0 0 24 24" fill="none" stroke="#2a7cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
      return { title: 'Add to Home Screen', body: `Tap ${share} Share, then <b style="display:inline;font-size:inherit">Add to Home Screen</b>.`, button: null };
    }
    return { title: 'Add to Home Screen', body: 'Open the browser menu <b style="display:inline;font-size:inherit">⋮</b> and choose <b style="display:inline;font-size:inherit">Add to Home screen</b> or <b style="display:inline;font-size:inherit">Install app</b>.', button: null };
  },

  render() {
    if (!this.shouldShow()) {
      this.hide();
      return;
    }
    const t = this.text();
    if (this.el) this.el.remove();
    const go = t.button ? h('button', { class: 'go', text: t.button, onclick: () => this.prompt() }) : null;
    this.el = h('div', { class: 'install' },
      h('img', { src: APP_ICON, alt: '' }),
      h('div', { class: 'txt', html: `<b>${t.title}</b>${t.body}` }),
      go,
      h('button', { class: 'x', 'aria-label': 'Close', text: '×', onclick: () => this.dismiss() }));
    document.body.append(this.el);
    requestAnimationFrame(() => requestAnimationFrame(() => this.el && this.el.classList.add('show')));
  },

  prompt() {
    const d = this.deferred;
    if (!d) return;
    this.deferred = null;
    d.prompt();
    d.userChoice.then((r) => {
      if (r.outcome === 'accepted') store.set('installDismissed', true);
      this.hide();
    }).catch(() => this.hide());
  },

  dismiss() {
    store.set('installDismissed', Date.now());
    this.hide();
  },

  hide() {
    if (!this.el) return;
    const el = this.el;
    this.el = null;
    el.classList.remove('show');
    setTimeout(() => el.remove(), 400);
  },
};

(function main() {
  document.body.append(h('div', { class: 'rotate' },
    h('div', { class: 'phone' }),
    h('div', { text: 'Turn your phone sideways to play' })));

  // A touch pointerdown is not a user activation in Chrome; pointerup and touchend are.
  const gesture = (e) => {
    Sound.unlock();
    if (e.type === 'pointerdown' && e.pointerType !== 'mouse') return;
    goImmersive();
    keepAwake();
  };
  for (const type of ['pointerdown', 'pointerup', 'touchend']) {
    document.addEventListener(type, gesture, { capture: true, passive: true });
  }
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  if (/[?&]debug\b/.test(location.search)) window.KIP_DEBUG = { App, S, Net };

  Net.on((ev) => App.onRelay(ev));
  App.show('connect');
  Net.start();
  Install.init();
}());

}());
