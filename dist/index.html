  return el;
}

// ---------------------------------------------------------------- shared state
const S = {
  welcome: null,
  consoles: [],
  linkUp: false,
  noRelay: false,
  status: { state: 'idle' },
  decades: false,
  sid: null,
  name: store.get('name', ''),
  avatars: [],
  selectedAvatar: null,
  pendingAvatar: null,
  pendingRequestId: null,
  avatarConfirmed: false,
  photo: null,
  profileSent: false,
  ready: false,
  started: false,
  holding: null,
  colours: null,
  images: new Map(),
  ppCommitted: false,
  overrideSent: false,
  categorySent: null,
  categoryRequestPending: false,
};

const QUIZ = { CONTINUE: 4, READY: 14, EXIT: 15, PAUSED: 29, UNPAUSED: 30, RESET_TO_NAME: 31 };
const KIP = 'KnowledgeIsPower.';

// Screens register here: Screens[name] = { game, local, mount(ctx) -> { el, onMsg?, ready? } }
const Screens = {};

const App = {
  cur: null,
  lastSeq: 0,
  replaying: false,
  replayBuf: [],
  listeners: new Set(),
  awaitStatusTimer: 0,

  // ---------------------------------------------------------------- screens
  show(name, ctx = {}) {
    const def = Screens[name];
    if (!def) {
      console.error('unknown screen', name);
      return;
    }
    if (this.cur) {
      this.cur.scope.dispose();
      this.cur.el.remove();
    }
    const scope = new Scope();
    const full = {
      msg: null, age: 0, after: [], seq: null, ...ctx, scope,
    };
    full.startedAt = performance.now() - full.age;
    full.sent = (type) => lastOf(full.after, (e) => e.dir === 'out' && shortType(e.m.TypeString) === type);
    full.got = (type, test) => lastOf(full.after, (e) => e.dir === 'in' && shortType(e.m.TypeString) === type && (!test || test(e.m)));
    full.remainingMs = (sec) => sec * 1000 - (performance.now() - full.startedAt);
    full.elapsedSec = () => (performance.now() - full.startedAt) / 1000;
    let inst;
    try {
      inst = def.mount(full);
    } catch (e) {
      console.error(`screen ${name} failed`, e);
      scope.dispose();
      if (name !== 'holding') this.show('holding', {});
      return;
    }
    inst.el.classList.add('screen', 'enter');
    document.getElementById('app').append(inst.el);
    document.body.classList.toggle('game', !!def.game);
    document.body.dataset.screen = name;
    this.cur = { name, def, inst, scope, ctx: full, el: inst.el };
    if (inst.ready) {
      try { inst.ready(); } catch (e) { console.error(e); }
    }
  },

  emit(what) {
    for (const fn of this.listeners) {
      try { fn(what); } catch (e) { console.error(e); }
    }
  },
  listen(scope, fn) {
    this.listeners.add(fn);
    scope.add(() => this.listeners.delete(fn));
  },

  send(m) {
    applyOut(m);
    Net.game(m);
  },

  // ---------------------------------------------------------------- relay events
  onRelay(ev) {
    switch (ev.op) {
      case 'norelay':
        S.noRelay = true;
        this.emit('relay');
        break;
      case 'open':
        S.linkUp = true;
        S.noRelay = false;
        Net.raw({
          op: 'hello', deviceUid: deviceUid(), name: S.name, model: deviceModel(), os: deviceOs(), factCount: FACTOIDS.length,
        });
        netbar(false);
        this.emit('relay');
        break;
      case 'closed':
        S.linkUp = false;
        if (S.status.state === 'connected' || S.status.state === 'connecting') netbar(true);
        this.emit('relay');
        break;
      case 'welcome':
        S.welcome = ev;
        S.consoles = ev.consoles || [];
        clearTimeout(this.awaitStatusTimer);
        this.awaitStatusTimer = setTimeout(() => this.noSession(), 600);
        this.emit('relay');
        break;
      case 'consoles':
        S.consoles = ev.consoles || [];
        this.emit('relay');
        break;
      case 'status':
        clearTimeout(this.awaitStatusTimer);
        this.onStatus(ev);
        break;
      case 'replayStart':
        this.replaying = true;
        this.replayBuf = [];
        break;
      case 'image':
        if (!S.images.has(ev.guid)) S.images.set(ev.guid, b64ToBlobUrl(ev.data));
        this.emit('image');
        break;
      case 'msg':
        if (this.replaying) this.replayBuf.push(ev);
        else this.onLive(ev);
        break;
      case 'replayEnd':
        this.replaying = false;
        this.restore(this.replayBuf);
        this.replayBuf = [];
        break;
      default:
        break;
    }
  },

  noSession() {
    const autojoin = store.get('autojoin');
    if (autojoin && S.consoles.some((c) => c.ip === autojoin)) {
      Net.raw({ op: 'connect', consoleIp: autojoin });
      return;
    }
    S.status = { state: 'idle' };
    if (!this.cur || this.cur.name !== 'connect') this.show('connect');
    this.emit('status');
  },

  onStatus(st) {
    const prevSid = S.sid;
    S.status = st;
    if (st.state === 'connected') {
      S.decades = !!st.decades;
      S.sid = st.sid || null;
      if (prevSid && st.sid && prevSid !== st.sid) this.lastSeq = 0;
      if (!st.replay) Net.setGameReady(true);
      netbar(false);
    } else {
      Net.setGameReady(false);
    }
    if (st.state === 'failed' || st.state === 'idle' || st.state === 'connecting') {
      if (st.state === 'failed') store.set('autojoin', null);
      if (st.state !== 'connecting') Net.clearQueue();
      if (st.state === 'connecting') resetSessionState();
      if (!this.cur || this.cur.name !== 'connect') this.show('connect');
    }
    this.emit('status');
  },

  onLive(ev) {
    if (ev.seq) this.lastSeq = Math.max(this.lastSeq, ev.seq);
    const type = shortType(ev.m.TypeString);
    if (ev.dir === 'out') {
      applyOut(ev.m);
      return;
    }
    applyIn(ev.m, type, true);
    this.dispatch(ev.m, type, { seq: ev.seq, age: 0 });
  },

  dispatch(m, type, meta) {
    const cur = this.cur;
    if (cur && cur.inst.onMsg) {
      try {
        if (cur.inst.onMsg(m, type, meta) === true) return;
      } catch (e) {
        console.error(e);
      }
    }
    const target = navTarget(m, type, cur ? cur.name : null);
    if (target) this.show(target, { msg: m, seq: meta.seq, age: meta.age || 0 });
  },

  // ---------------------------------------------------------------- reconnect restore
  // The relay replays the whole session. Work out which screen the phone should be on
  // and what it already did there, then either keep the current screen (and feed it
  // what it missed) or rebuild it in the right state.
  restore(buf) {
    resetSessionState();
    let nav = null;
    let virt = 'connect';
    for (const e of buf) {
      const type = shortType(e.m.TypeString);
      if (e.dir === 'in') {
        applyIn(e.m, type, false, virt);
        const target = navTarget(e.m, type, virt);
        if (target) {
          nav = { name: target, msg: e.m, age: e.age, seq: e.seq, after: [] };
          virt = target;
          continue;
        }
      } else {
        applyOut(e.m);
        if (type === 'ClientPlayerProfileMessage') {
          nav = { name: 'waiting', msg: null, age: e.age, seq: e.seq, after: [] };
          virt = 'waiting';
          continue;
        }
        if (type === 'ClientRequestAvatarMessage' && virt === 'name') {
          nav = { name: 'photo', msg: null, age: e.age, seq: e.seq, after: [] };
          virt = 'photo';
        }
      }
      if (nav) nav.after.push(e);
    }
    const maxSeq = buf.reduce((m, e) => Math.max(m, e.seq || 0), 0);
    const missed = buf.filter((e) => e.dir === 'in' && (e.seq || 0) > this.lastSeq);
    const cur = this.cur;
    const keep = nav && cur && cur.name === nav.name && (cur.ctx.seq === nav.seq || Screens[nav.name].local);
    // Answers given while the link was down are still queued; the rebuilt screen must see them.
    if (nav) for (const m of Net.pendingGame()) nav.after.push({ dir: 'out', m, age: 0 });

    Net.setGameReady(true);
    this.lastSeq = maxSeq;

    if (keep) {
      for (const e of missed) {
        if (this.cur !== cur) break;
        if (e.seq <= (cur.ctx.seq || 0)) continue;
        this.dispatch(e.m, shortType(e.m.TypeString), { seq: e.seq, age: e.age, late: true });
      }
      this.emit('status');
      return;
    }
    if (!nav) {
      if (!cur || cur.name !== 'connect') this.show('connect');
      this.emit('status');
      return;
    }
    const def = Screens[nav.name];
    if (def.duration && nav.msg) {
      const dur = def.duration(nav.msg);
      const answered = def.answerType && nav.after.some((e) => e.dir === 'out' && shortType(e.m.TypeString) === def.answerType);
      if (!answered && nav.age > dur * 1000 + 2000) {
        this.show('holding', { stale: true });
        return;
      }
    }
    this.show(nav.name, { msg: nav.msg, age: nav.age, seq: nav.seq, after: nav.after, restored: true });
    this.emit('status');
  },
};

function lastOf(arr, test) {
  for (let i = arr.length - 1; i >= 0; i--) if (test(arr[i])) return arr[i].m;
  return null;
}

function resetSessionState() {
  S.avatars = [];
  S.pendingAvatar = null;
  S.avatarConfirmed = false;
  S.profileSent = false;
  S.ready = false;
  S.started = false;
  S.holding = null;
  S.colours = null;
  S.ppCommitted = false;
  S.overrideSent = false;
  S.categorySent = null;
  S.categoryRequestPending = false;
}

// ---------------------------------------------------------------- routing rules
// Mirrors which messages each Android screen listened for. Name entry and the
// photo screen only react to a reset, like the original.
function navTarget(m, type, cur) {
  const lobbyInput = cur === 'name' || cur === 'photo';
  if (type === 'ClientQuizCommandMessage') {
    if (m.action === QUIZ.RESET_TO_NAME) return cur === 'endfact' || cur === 'name' ? null : 'name';
    if (m.action === QUIZ.CONTINUE && !lobbyInput) return 'continue';
    return null;
  }
  if (type === 'RejoiningClientOwnProfileMessage') return 'holding';
  if (lobbyInput) return null;
  switch (type) {
    case 'ClientHoldingScreenCommandMessage':
      return cur === 'continue' && m.HoldingScreenType === 5 ? null : 'holding';
    case 'ServerCategorySelectOverrideSuccess': return 'holding';
    case 'ServerCategorySelectChoices': return 'category';
    case 'ServerBeginCategorySelectOverride': return 'powerpick';
    case 'ServerBeginTriviaAnsweringPhase': return 'trivia';
    case 'ServerBeginPowerPlayPhase': return 'powerplay';
    case 'ServerBeginLinkingAnsweringPhase': return 'pairs';
    case 'ServerBeginOrderingAnsweringPhase': return 'chain';
    case 'ServerBeginSortingAnsweringPhase': return 'sorting';
    case 'ServerBeginEliminatingAnsweringPhase': return 'elimination';
    case 'ServerBeginMissingLetterAnsweringPhase': return 'missing';
    case 'ServerBeginMatchingAnsweringPhase': return 'matching';
    case 'ClientEndOfGameFactCommandMessage': return 'endfact';
    default: return null;
  }
}

// State every screen relies on, plus the replies the console must always get.
function applyIn(m, type, live, curName) {
  const cur = curName !== undefined ? curName : App.cur ? App.cur.name : null;
  switch (type) {
    case 'InterfaceVersionMessage':
      resetSessionState();
      break;
    case 'ServerAvatarStatusMessage': {
      const i = S.avatars.findIndex((a) => a.AvatarID === m.AvatarID);
      if (i >= 0) S.avatars[i] = { AvatarID: m.AvatarID, Available: m.Available };
      else if (m.Available) S.avatars.push({ AvatarID: m.AvatarID, Available: true });
      if (live) App.emit('avatars');
      break;
    }
    case 'ServerAvatarRequestResponseMessage':
      if (m.AvatarID === S.pendingAvatar) {
        if (m.Available) {
          S.selectedAvatar = m.AvatarID;
          S.avatarConfirmed = true;
        } else if (live) {
          toast('Someone else just took that avatar');
        }
        S.pendingAvatar = null;
      }
      if (live) App.emit('avatars');
      break;
    case 'RejoiningClientOwnProfileMessage':
      if (m.Name) S.name = m.Name;
      if (m.AvatarID) S.selectedAvatar = m.AvatarID;
      S.avatarConfirmed = true;
      S.profileSent = true;
      break;
    case 'ClientHoldingScreenCommandMessage':
      S.holding = m;
      break;
    case 'KnowledgeIsPower.ServerColourMessage':
    case 'ServerColourMessage':
      S.colours = m;
      break;
    case 'ClientQuizCommandMessage':
      if (m.action === QUIZ.READY) S.ready = true;
      if (m.action === QUIZ.RESET_TO_NAME) {
        S.ready = false;
        S.started = false;
        S.profileSent = false;
        S.avatarConfirmed = false;
      }
      if (live && m.action === QUIZ.PAUSED) toast('The game is paused on the TV');
      break;
    case 'ServerCategorySelectChoices':
      S.categorySent = null;
      S.categoryRequestPending = false;
      break;
    case 'ServerRequestCategorySelectChoice':
      if (cur !== 'category') S.categoryRequestPending = true;
      break;
    case 'ServerBeginCategorySelectOverride':
      S.overrideSent = false;
      break;
    case 'ServerStopCategorySelectOverride':
      if (live && cur !== 'powerpick') App.send({ TypeString: `${KIP}ClientStopCategorySelectOverrideResponse`, OverrideSent: S.overrideSent });
      break;
    case 'ServerBeginPowerPlayPhase':
      S.ppCommitted = false;
      break;
    case 'ServerRequestPowerPlayChoice':
      if (live && cur !== 'powerplay' && !S.ppCommitted) sendPowerPlayChoice(-1, []);
      break;
    default:
      break;
  }
}

function applyOut(m) {
  switch (shortType(m.TypeString)) {
    case 'ClientRequestAvatarMessage':
      if (m.Request) {
        S.pendingAvatar = m.AvatarID;
        S.pendingRequestId = m.RequestID;
        S.avatarConfirmed = false;
      } else if (S.selectedAvatar === m.AvatarID) {
        S.selectedAvatar = null;
      }
      break;
    case 'ClientPlayerProfileMessage':
      S.profileSent = true;
      break;
    case 'StartGameButtonPressedResponseMessage':
      S.started = true;
      break;
    case 'ClientPowerPlayChoice':
      S.ppCommitted = true;
      break;
    case 'ClientCategorySelectOverride':
      S.overrideSent = true;
      break;
    case 'ClientCategorySelectChoice':
      S.categorySent = m.ChosenCategoryIndex;
      break;
    default:
      break;
  }
}

function sendPowerPlayChoice(slot, targets) {
  App.send({ TypeString: `${KIP}ClientPowerPlayChoice`, PowerPlaySlotIndex: slot, TargetSlotIndex: targets });
}

// ---------------------------------------------------------------- device info
function deviceModel() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad|Macintosh.*Mobile/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'iPad';
  const m = ua.match(/Android [\d.]+; ([^;)]+)/);
  if (m && m[1] && m[1] !== 'K') return m[1].trim();
  if (/Android/.test(ua)) return 'Android phone';
  return 'Web phone';
}

function deviceOs() {
  const ua = navigator.userAgent;
  let m = ua.match(/OS (\d+)[_.](\d+)/);
  if (/iPhone|iPad/.test(ua) && m) return `iOS ${m[1]}.${m[2]}`;
  m = ua.match(/Android ([\d.]+)/);
  if (m) return `Android ${m[1]}`;
  return 'Web';
}

const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const isAndroid = () => /Android/.test(navigator.userAgent);
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

// Landscape and full screen like the original app, where the browser allows it.
function goImmersive() {
  if (isIOS() || isStandalone()) return;
  const el = document.documentElement;
  if (document.fullscreenElement || !el.requestFullscreen) return;
  el.requestFullscreen({ navigationUI: 'hide' })
    .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
    .catch(() => {});
}

let wakeLock = null;
function keepAwake() {
  if (!navigator.wakeLock || wakeLock || document.hidden) return;
  navigator.wakeLock.request('screen').then((l) => {
    wakeLock = l;
    l.addEventListener('release', () => { wakeLock = null; });
  }).catch(() => {});
}
document.addEventListener('visibilitychange', keepAwake);

function netbar(show) {
  let el = document.querySelector('.netbar');
  if (!el) {
    el = h('div', { class: 'netbar' }, h('div', { class: 'spinner' }), h('span', { text: 'Reconnecting…' }));
    document.body.append(el);
  }
  el.classList.toggle('show', show);
}

// Power-play effects drawn over the trivia answers. Per-answer effects draw into the
// answer's own canvas; screen-wide effects draw into one canvas over the whole grid.
// Positions are stored as fractions of their box so a rotation or resize keeps progress.

const PT = {
  NONE: -1, BET: 1, FREEZE: 4, BOMBLES: 5, NIBBLERS: 6, GLOOP: 7, POINTS_PARTY: 8,
  DT_FREEZE_GLOOP: 10, DT_FREEZE_BOMBLES: 11, DT_NIBBLERS_GLOOP: 12,
  LOCKDOWN: 20, ZIPPERS: 22, BUG: 24, POINTS_DOUBLER: 25, FIFTY_FIFTY: 26, LETTER_SCATTER: 28, DISCO: 29,
};
const DT_PARTS = { 10: [PT.FREEZE, PT.GLOOP], 11: [PT.FREEZE, PT.BOMBLES], 12: [PT.NIBBLERS, PT.GLOOP] };

function powerCounts(list) {
  const counts = {};
  for (const pp of list || []) {
    const types = DT_PARTS[pp.PowerType] || [pp.PowerType];
    for (const t of types) counts[t] = (counts[t] || 0) + (pp.Count || 0);
  }
  return counts;
}

// ---------------------------------------------------------------- answer text: nibblers and letter scatter
function textFx(text, { scatter = false, bites = 0, maxFont = 34 } = {}) {
  const start = performance.now();
  const chars = Array.from(String(text)).map(() => ({ p1: rand(0, 6.28), p2: rand(0, 6.28), s1: rand(260, 420), s2: rand(380, 620), dy: rand(-1, 1), rot: rand(-1, 1) }));
  const biteList = Array.from({ length: bites }, (_, i) => ({ u: rand(0.05, 0.95), v: rand(0.1, 0.9), r: rand(0.45, 0.7), at: 350 + i * 260, a: rand(0, 6.28), played: false }));
  return {
    active: true,
    animated: () => scatter || biteList.some((b) => !b.played),
    draw(ctx, w, hh, now) {
      const padX = Math.min(58, w * 0.12);
      const { size, lines } = fitFont(ctx, text, w - padX * 2, hh * 0.86, maxFont, 11, 900);
      const lineH = size * 1.15;
      const top = (hh - lines.length * lineH) / 2;
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;
      ctx.shadowBlur = 3;
      let minX = w;
      let maxX = 0;
      let k = 0;
      lines.forEach((line, li) => {
        const y = top + lineH * (li + 0.5);
        const lw = ctx.measureText(line).width;
        let x = (w - lw) / 2;
        minX = Math.min(minX, x);
        maxX = Math.max(maxX, x + lw);
        if (!scatter) {
          ctx.textAlign = 'left';
          ctx.fillText(line, x, y);
          k += line.length + 1;
          return;
        }
        for (const ch of Array.from(line)) {
          const cw = ctx.measureText(ch).width;
          const c = chars[k % chars.length];
          const dy = Math.sin(now / c.s1 + c.p1) * 0.25 * size;
          const rot = (Math.sin(now / c.s2 + c.p2) * 7 * Math.PI) / 180;
          ctx.save();
          ctx.translate(x + cw / 2, y + dy);
          ctx.rotate(rot);
          ctx.textAlign = 'center';
          ctx.fillText(ch, 0, 0);
          ctx.restore();
          x += cw;
          k++;
        }
        k++;
      });
      ctx.restore();
      if (biteList.length) {
        const bx = minX - size * 0.2;
        const bw = maxX - minX + size * 0.4;
        const by = top;
        const bh = lines.length * lineH;
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        for (const b of biteList) {
          if (now - start < b.at) continue;
          if (!b.played) {
            b.played = true;
            Sound.play('chomp');
          }
          const cx = bx + b.u * bw;
          const cy = by + b.v * bh;
          const r = b.r * size;
          ctx.beginPath();
          for (let i = 0; i < 3; i++) {
            const a = b.a + (i - 1) * 0.6;
            ctx.moveTo(cx + Math.cos(a) * r * 0.35 + r * 0.62, cy + Math.sin(a) * r * 0.35);
            ctx.arc(cx + Math.cos(a) * r * 0.35, cy + Math.sin(a) * r * 0.35, r * 0.62, 0, Math.PI * 2);
          }
          ctx.fill();
        }
        ctx.restore();
      }
    },
  };
}

// ---------------------------------------------------------------- ice (freeze): tap to crack
function iceFx(count) {
  const total = 5 * count;
  const st = {
    active: true,
    left: total,
    cracks: [],
    shards: [],
    brokeAt: 0,
    specks: Array.from({ length: 46 }, () => ({ u: Math.random(), v: Math.random(), r: rand(0.6, 2.2), a: rand(0.25, 0.8) })),
    streaks: Array.from({ length: 6 }, () => ({ u: rand(-0.1, 1), v: rand(0, 1), len: rand(0.15, 0.4) })),
  };
  return {
    get active() { return st.active; },
    animated: () => st.brokeAt && performance.now() - st.brokeAt < 500,
    tap(u, v) {
      if (!st.active) return false;
      st.left--;
      const branches = randInt(3, 5);
      for (let b = 0; b < branches; b++) {
        let a = rand(0, Math.PI * 2);
        let x = u;
        let y = v;
        const pts = [[x, y]];
        for (let i = 0; i < randInt(3, 5); i++) {
          a += rand(-0.6, 0.6);
          const len = rand(0.04, 0.11);
          x += Math.cos(a) * len;
          y += Math.sin(a) * len * 2.2;
          pts.push([x, y]);
        }
        st.cracks.push(pts);
      }
      Sound.vibrate(10);
      if (st.left <= 0) {
        st.active = false;
        st.brokeAt = performance.now();
        st.shards = Array.from({ length: 16 }, () => ({ u: rand(0.05, 0.95), v: rand(0.1, 0.9), vx: rand(-0.4, 0.4), vy: rand(-0.6, 0.1), rot: rand(0, 6), vr: rand(-8, 8), s: rand(0.05, 0.12) }));
        Sound.play('shatter');
        Sound.vibrate([15, 20, 15]);
      } else {
        Sound.play('crack');
      }
      return true;
    },
    draw(ctx, w, hh, now) {
      if (st.active) {
        ctx.save();
        roundRect(ctx, 0, 0, w, hh, 8);
        ctx.fillStyle = 'rgba(202,223,234,0.53)';
        ctx.fill();
        ctx.clip();
        const g = ctx.createLinearGradient(0, 0, w, hh);
        g.addColorStop(0, 'rgba(255,255,255,0.35)');
        g.addColorStop(0.5, 'rgba(255,255,255,0.05)');
        g.addColorStop(1, 'rgba(255,255,255,0.25)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, hh);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 3;
        for (const sk of st.streaks) {
          ctx.beginPath();
          ctx.moveTo(sk.u * w, sk.v * hh);
          ctx.lineTo((sk.u + sk.len) * w, sk.v * hh - sk.len * w);
          ctx.stroke();
        }
        for (const sp of st.specks) {
          ctx.fillStyle = `rgba(255,255,255,${sp.a})`;
          ctx.beginPath();
          ctx.arc(sp.u * w, sp.v * hh, sp.r, 0, Math.PI * 2);
          ctx.fill();
        }
        const damage = 1 - st.left / total;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (const pts of st.cracks) {
          for (const [col, lw] of [['rgba(60,90,110,0.45)', 3], [`rgba(255,255,255,${0.75 + damage * 0.25})`, 1.4]]) {
            ctx.strokeStyle = col;
            ctx.lineWidth = lw;
            ctx.beginPath();
            pts.forEach(([x, y], i) => (i ? ctx.lineTo(x * w, y * hh) : ctx.moveTo(x * w, y * hh)));
            ctx.stroke();
          }
        }
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 2;
        roundRect(ctx, 1, 1, w - 2, hh - 2, 8);
        ctx.stroke();
        return;
      }
      const t = (now - st.brokeAt) / 1000;
      if (t > 0.5) return;
      ctx.save();
      ctx.globalAlpha = 1 - t / 0.5;
      ctx.fillStyle = 'rgba(220,236,245,0.85)';
      for (const sh of st.shards) {
        const x = (sh.u + sh.vx * t) * w;
        const y = (sh.v + sh.vy * t + 1.6 * t * t) * hh;
        const sz = sh.s * Math.min(w, hh * 2);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(sh.rot + sh.vr * t);
        ctx.beginPath();
        ctx.moveTo(0, -sz);
        ctx.lineTo(sz * 0.7, sz * 0.6);
        ctx.lineTo(-sz * 0.6, sz * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    },
  };
}

// ---------------------------------------------------------------- gloop: wipe it away
const GLOOP_COLOURS = ['rgba(76,175,80,0.93)', 'rgba(129,199,132,0.67)', 'rgba(56,142,60,0.87)', 'rgba(0,230,118,0.33)'];

function gloopFx(count) {
  const st = {
    active: true,
    fadeAt: 0,
    blobs: Array.from({ length: 16 + 6 * count }, () => ({ u: rand(-0.05, 1.05), v: rand(-0.1, 1.1), r: rand(0.22, 0.5), c: pick(GLOOP_COLOURS), hu: rand(-0.3, 0.3) })),
    drips: Array.from({ length: randInt(4, 7) }, () => ({ u: rand(0.05, 0.95), len: rand(0.1, 0.32), r: rand(0.03, 0.06) })),
    strokes: [],
    grid: new Array(60).fill(false),
    last: null,
    layer: document.createElement('canvas'),
    lw: 0,
    lh: 0,
    lastSound: 0,
  };
  const brush = (w, hh) => (Math.min(w, hh) * 0.216) / Math.max(1, count);

  function rebuild(w, hh) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    st.layer.width = Math.max(1, Math.round(w * dpr));
    st.layer.height = Math.max(1, Math.round(hh * dpr));
    st.lw = w;
    st.lh = hh;
    const c = st.layer.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.save();
    roundRect(c, 0, 0, w, hh, 8);
    c.clip();
    const m = Math.min(w, hh);
    for (const b of st.blobs) {
      c.fillStyle = b.c;
      c.beginPath();
      c.ellipse(b.u * w, b.v * hh, b.r * m * 1.3, b.r * m, 0, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = 'rgba(56,142,60,0.9)';
    for (const d of st.drips) {
      c.fillRect(d.u * w - d.r * m, hh * (1 - d.len), d.r * m * 2, d.len * hh);
      c.beginPath();
      c.arc(d.u * w, hh, d.r * m * 1.3, 0, Math.PI * 2);
      c.fill();
    }
    for (const b of st.blobs) {
      c.fillStyle = 'rgba(255,255,255,0.22)';
      c.beginPath();
      c.ellipse(b.u * w - b.r * m * 0.35, b.v * hh - b.r * m * 0.4, b.r * m * 0.3, b.r * m * 0.16, -0.5, 0, Math.PI * 2);
      c.fill();
    }
    c.restore();
    c.globalCompositeOperation = 'destination-out';
    c.lineCap = 'round';
    c.lineWidth = brush(w, hh) * 2;
    for (const sg of st.strokes) {
      c.beginPath();
      c.moveTo(sg[0] * w, sg[1] * hh);
      c.lineTo(sg[2] * w + 0.01, sg[3] * hh);
      c.stroke();
    }
    c.globalCompositeOperation = 'source-over';
  }

  return {
    get active() { return st.active; },
    animated: () => st.fadeAt && performance.now() - st.fadeAt < 220,
    wipe(u, v, w, hh, newContact) {
      if (!st.active || st.fadeAt) return;
      const from = !st.last || newContact ? [u, v] : st.last;
      st.last = [u, v];
      st.strokes.push([from[0], from[1], u, v]);
      const c = st.layer.getContext('2d');
      c.globalCompositeOperation = 'destination-out';
      c.lineCap = 'round';
      c.lineWidth = brush(w, hh) * 2;
      c.beginPath();
      c.moveTo(from[0] * w, from[1] * hh);
      c.lineTo(u * w + 0.01, v * hh);
      c.stroke();
      c.globalCompositeOperation = 'source-over';
      const r = brush(w, hh);
      for (let gy = 0; gy < 6; gy++) {
        for (let gx = 0; gx < 10; gx++) {
          const i = gy * 10 + gx;
          if (st.grid[i]) continue;
          const px = ((gx + 0.5) / 10) * w;
          const py = ((gy + 0.5) / 6) * hh;
          if (distToSeg(px, py, from[0] * w, from[1] * hh, u * w, v * hh) <= r) st.grid[i] = true;
        }
      }
      const now = performance.now();
      if (now - st.lastSound > 130) {
        st.lastSound = now;
        Sound.play('squish');
      }
      if (st.grid.filter(Boolean).length >= 60 * 0.65) {
        st.fadeAt = now;
        setTimeout(() => { st.active = false; }, 200);
      }
    },
    endContact() { st.last = null; },
    draw(ctx, w, hh, now) {
      if (!st.active) return;
      if (st.lw !== w || st.lh !== hh) rebuild(w, hh);
      ctx.save();
      if (st.fadeAt) ctx.globalAlpha = clamp(1 - (now - st.fadeAt) / 200, 0, 1);
      ctx.drawImage(st.layer, 0, 0, w, hh);
      ctx.restore();
    },
  };
}

function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  const l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1) : 0;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

// ---------------------------------------------------------------- zippers: drag the pull across
function zipperFx(count) {
  const st = { active: true, layer: 0, layers: clamp(count, 1, 3), q: 0, openAt: 0, lastSound: 0 };
  const DENIM = [['#3088B8', '#2878A8'], ['#2C6E9A', '#245E86'], ['#3B95C2', '#2F80AE']];
  const pullX = (w) => w * (0.08 + st.q * 0.75);
  return {
    get active() { return st.active; },
    animated: () => !!st.openAt,
    grab(x, y, w, hh) {
      if (!st.active || st.openAt) return null;
      if (Math.hypot(x - pullX(w), y - hh / 2) > hh * 0.45) return null;
      Sound.play('zip');
      return { q0: st.q, x0: x };
    },
    drag(g, x, w) {
      const q = clamp(g.q0 + (x - g.x0) / (w * 0.75), 0, 1);
      if (Math.abs(q - st.q) > 0.04 && performance.now() - st.lastSound > 70) {
        st.lastSound = performance.now();
        Sound.play('zip');
      }
      st.q = q;
    },
    release() {
      if (st.q <= 0.85 || st.openAt) return;
      st.openAt = performance.now();
      Sound.play('unzip');
      Sound.vibrate(20);
    },
    draw(ctx, w, hh, now) {
      if (!st.active) return;
      let slide = 0;
      if (st.openAt) {
        slide = clamp((now - st.openAt) / 250, 0, 1);
        if (slide >= 1) {
          st.openAt = 0;
          st.q = 0;
          st.layer++;
          if (st.layer >= st.layers) {
            st.active = false;
            return;
          }
          slide = 0;
        }
      }
      const [c1, c2] = DENIM[st.layer % DENIM.length];
      const px = st.openAt ? w : pullX(w);
      const gap = st.openAt ? hh / 2 : Math.min(hh / 2, st.q * hh * 0.6);
      const mid = hh / 2;
      ctx.save();
      roundRect(ctx, 0, 0, w, hh, 8);
      ctx.clip();
      const denim = ctx.createLinearGradient(0, 0, 0, hh);
      denim.addColorStop(0, c1);
      denim.addColorStop(1, c2);
      for (const half of [-1, 1]) {
        ctx.save();
        ctx.translate(0, half * slide * hh * 0.6);
        ctx.beginPath();
        if (half < 0) {
          ctx.moveTo(0, 0); ctx.lineTo(w, 0); ctx.lineTo(w, mid); ctx.lineTo(px, mid); ctx.lineTo(0, mid - gap);
        } else {
          ctx.moveTo(0, hh); ctx.lineTo(w, hh); ctx.lineTo(w, mid); ctx.lineTo(px, mid); ctx.lineTo(0, mid + gap);
        }
        ctx.closePath();
        ctx.fillStyle = denim;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,214,120,0.75)';
        ctx.setLineDash([5, 4]);
        ctx.lineWidth = 1.4;
        ctx.strokeRect(6, 6, w - 12, hh - 12);
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        for (let x = -hh; x < w; x += 5) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + hh, hh);
          ctx.stroke();
        }
        ctx.restore();
      }
      if (!st.openAt) {
        ctx.fillStyle = '#C9A227';
        const tooth = 6;
        for (let x = px; x < w * 0.86; x += tooth) {
          ctx.fillRect(x, mid - 4, tooth * 0.55, 4);
          ctx.fillRect(x + tooth / 2, mid, tooth * 0.55, 4);
        }
        ctx.fillRect(w * 0.86, mid - 6, 6, 12);
        for (const half of [-1, 1]) {
          const steps = Math.max(1, Math.floor(px / tooth));
          for (let i = 0; i < steps; i++) {
            const t = i / steps;
            const x = t * px;
            const y = mid + half * gap * (1 - t);
            ctx.fillRect(x, y - (half < 0 ? 4 : 0), tooth * 0.55, 4);
          }
        }
        const pull = ctx.createLinearGradient(px - 12, 0, px + 12, 0);
        pull.addColorStop(0, '#FFE082');
        pull.addColorStop(1, '#C9A227');
        ctx.fillStyle = pull;
        roundRect(ctx, px - 9, mid - 10, 26, 20, 6);
        ctx.fill();
        ctx.strokeStyle = '#8D6E1A';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(px + 22, mid, 7, 0, Math.PI * 2);
        ctx.strokeStyle = '#C9A227';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      ctx.restore();
    },
  };
}

// ---------------------------------------------------------------- disco inferno (not touchable)
function discoFx() {
  const cells = Array.from({ length: 54 }, () => ({ hue: rand(0, 360), sp: rand(0.5, 2) * (Math.random() < 0.5 ? -1 : 1), k: randInt(0, 2) }));
  const alphas = [96 / 255, 72 / 255, 84 / 255];
  let frames = 0;
  let nextFlash = 20;
  Sound.play('disco');
  return {
    active: true,
    animated: () => true,
    update(dt) {
      const f = dt / 16.67;
      frames += f;
      for (const c of cells) c.hue = (c.hue + c.sp * f + 360) % 360;
      if (frames >= nextFlash) {
        nextFlash += 20;
        for (const c of cells) c.k = (c.k + 1) % 3;
      }
    },
    draw(ctx, W, H) {
      const cw = W / 9;
      const ch = H / 6;
      for (let i = 0; i < 54; i++) {
        const c = cells[i];
        ctx.fillStyle = hsv(c.hue, 1, 1, alphas[c.k]);
        ctx.fillRect((i % 9) * cw, Math.floor(i / 9) * ch, cw + 0.5, ch + 0.5);
      }
    },
  };
}

// ---------------------------------------------------------------- bombles: do not touch
function bomblesFx(count, W, H) {
  const n = clamp(2 * count + 4, 6, 10);
  const spawn = (b) => {
    const a = rand(0, Math.PI * 2);
    const sp = rand(1.5, 3.5);
    Object.assign(b, { x: rand(b.size, W - b.size), y: rand(b.size, H - b.size), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, alive: true });
  };
  const bombs = Array.from({ length: n }, () => {
    const b = { size: 50 * rand(0.85, 1.15), phase: rand(0, 6.28) };
    spawn(b);
    return b;
  });
  const booms = [];
  return {
    active: true,
    animated: () => true,
    hit(p) {
      return bombs.find((b) => b.alive && Math.hypot(p.x - b.x, p.y - b.y) < b.size * 0.58) || null;
    },
    explode(b) {
      b.alive = false;
      booms.push({ x: b.x, y: b.y, t0: performance.now(), parts: Array.from({ length: 14 }, () => ({ a: rand(0, 6.28), v: rand(80, 260) })) });
      setTimeout(() => spawn(b), 1900);
    },
    update(dt, w, hh) {
      W = w;
      H = hh;
      const f = dt / 16.67;
      for (const b of bombs) {
        if (!b.alive) continue;
        const r = b.size / 2;
        b.x += b.vx * f;
        b.y += b.vy * f;
        if (b.x < r) { b.x = r; b.vx = Math.abs(b.vx); }
        if (b.x > W - r) { b.x = W - r; b.vx = -Math.abs(b.vx); }
        if (b.y < r) { b.y = r; b.vy = Math.abs(b.vy); }
        if (b.y > H - r) { b.y = H - r; b.vy = -Math.abs(b.vy); }
      }
    },
    draw(ctx, w, hh, now) {
      for (const b of bombs) {
        if (!b.alive) continue;
        const r = b.size / 2;
        const wob = Math.sin(now / 180 + b.phase) * 0.12;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(wob);
        ctx.strokeStyle = '#8D6E63';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(r * 0.35, -r * 0.8);
        ctx.quadraticCurveTo(r * 0.7, -r * 1.25, r * 0.95, -r * 1.05);
        ctx.stroke();
        const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
        g.addColorStop(0, '#666');
        g.addColorStop(1, '#111');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#333';
        ctx.fillRect(r * 0.05, -r * 1.02, r * 0.45, r * 0.32);
        const flick = 0.6 + 0.4 * Math.sin(now / 40 + b.phase * 3);
        ctx.fillStyle = `rgba(255,${Math.round(160 + 80 * flick)},0,${flick})`;
        ctx.beginPath();
        ctx.arc(r * 0.95, -r * 1.05, 4 + 3 * flick, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(r * 0.95, -r * 1.05, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      for (let i = booms.length - 1; i >= 0; i--) {
        const bm = booms[i];
        const t = (now - bm.t0) / 1000;
        if (t > 0.6) { booms.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = 1 - t / 0.6;
        const rr = 20 + t * 220;
        const g = ctx.createRadialGradient(bm.x, bm.y, 0, bm.x, bm.y, rr);
        g.addColorStop(0, 'rgba(255,255,200,1)');
        g.addColorStop(0.4, 'rgba(255,160,0,0.9)');
        g.addColorStop(1, 'rgba(255,60,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(bm.x, bm.y, rr, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFB300';
        for (const p of bm.parts) {
          ctx.beginPath();
          ctx.arc(bm.x + Math.cos(p.a) * p.v * t, bm.y + Math.sin(p.a) * p.v * t, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    },
  };
}

// ---------------------------------------------------------------- lockdown: chains with padlocks
function seededRandom(seed) {
  let x = seed >>> 0 || 1;
  return () => {
    x ^= x << 13; x >>>= 0;
    x ^= x >>> 17;
    x ^= x << 5; x >>>= 0;
    return x / 4294967296;
  };
}

function lockdownFx(n) {
  n = clamp(n, 1, 6);
  const rng = seededRandom(n * 7 + 13);
  const spots = [];
  for (let i = 0; i < n; i++) {
    let best = null;
    for (let tries = 0; tries < 50; tries++) {
      const c = { u: 0.15 + rng() * 0.7, v: 0.15 + rng() * 0.7 };
      best = c;
      if (spots.every((s) => Math.hypot(s.u - c.u, (s.v - c.v) * 0.5) >= 0.3)) break;
    }
    spots.push(best);
  }
  const locks = spots.map((s) => ({
    ...s,
    open: 0,
    chains: Array.from({ length: 3 + Math.floor(rng() * 3) }, () => ({
      ang: ((30 + rng() * 30 + 90 * Math.floor(rng() * 4)) * Math.PI) / 180,
      off: (rng() - 0.5) * 120,
    })),
  }));
  const st = { active: true, doneAt: 0 };
  const lockS = (W) => 0.0675 * W;

  function drawChain(ctx, W, H, cx, cy, ch) {
    const len = 2 * (W + H);
    const linkW = 60;
    const count = Math.floor(len / (linkW * 0.8));
    const px = cx - Math.sin(ch.ang) * ch.off;
    const py = cy + Math.cos(ch.ang) * ch.off;
    const dx = Math.cos(ch.ang);
    const dy = Math.sin(ch.ang);
    for (let i = 0; i <= count; i++) {
      const d = -len / 2 + (i / count) * len;
      const x = px + dx * d;
      const y = py + dy * d;
      if (x < -120 || y < -120 || x > W + 120 || y > H + 120) continue;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ch.ang + (i % 2 ? Math.PI / 2 : 0));
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(0,0,0,0.376)';
      ctx.lineWidth = 8;
      roundRect(ctx, -30 + 1.5, -18 + 2, 60, 36, 18);
      ctx.stroke();
      ctx.strokeStyle = '#E0C850';
      ctx.lineWidth = 6;
      roundRect(ctx, -30, -18, 60, 36, 18);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawPadlock(ctx, cx, cy, s) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#887010';
    ctx.lineWidth = 0.16 * s;
    ctx.beginPath();
    ctx.arc(cx, cy - 0.55 * s, 0.3 * s, Math.PI, 0);
    ctx.moveTo(cx - 0.3 * s, cy - 0.55 * s);
    ctx.lineTo(cx - 0.3 * s, cy - 0.25 * s);
    ctx.moveTo(cx + 0.3 * s, cy - 0.55 * s);
    ctx.lineTo(cx + 0.3 * s, cy - 0.25 * s);
    ctx.stroke();
    const bx = cx - 0.5 * s;
    const by = cy - 0.25 * s;
    const bw = s;
    const bh = 0.85 * s;
    ctx.fillStyle = '#A07010';
    roundRect(ctx, bx, by, bw, bh, 0.12 * s);
    ctx.fill();
    ctx.strokeStyle = '#604008';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#C89820';
    roundRect(ctx, bx + 0.08 * bw, by + 0.06 * bh, 0.34 * bw, 0.32 * bh, 0.06 * s);
    ctx.fill();
    const ky = by + 0.48 * bh;
    ctx.fillStyle = '#302008';
    ctx.beginPath();
    ctx.arc(cx, ky, 0.12 * s, 0, Math.PI * 2);
    ctx.moveTo(cx - 0.054 * s, ky + 0.06 * s);
    ctx.lineTo(cx + 0.054 * s, ky + 0.06 * s);
    ctx.lineTo(cx, ky + 0.3 * s);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  return {
    get active() { return st.active; },
    animated: () => locks.some((l) => l.open && performance.now() - l.open < 450) || !!st.doneAt,
    tap(p, W, H) {
      if (!st.active) return false;
      const reach = 2 * lockS(W);
      const l = locks.find((k) => !k.open && Math.hypot(p.x - k.u * W, p.y - k.v * H) <= reach);
      if (l) {
        l.open = performance.now();
        Sound.play('unlock');
        Sound.vibrate(12);
        if (locks.every((k) => k.open)) {
          Sound.play('chains');
          st.doneAt = performance.now() + 250;
        }
      }
      return true;
    },
    draw(ctx, W, H, now) {
      if (!st.active) return;
      let fade = 1;
      if (st.doneAt && now > st.doneAt) {
        fade = clamp(1 - (now - st.doneAt) / 200, 0, 1);
        if (fade <= 0) { st.active = false; return; }
      }
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(0, 0, W, H);
      const s = lockS(W);
      for (const l of locks) {
        const t = l.open ? clamp((now - l.open) / 400, 0, 1) : 0;
        if (t >= 1) continue;
        ctx.globalAlpha = fade * (1 - t);
        for (const ch of l.chains) drawChain(ctx, W, H, l.u * W, l.v * H + t * t * H * 0.4, ch);
      }
      for (const l of locks) {
        const t = l.open ? clamp((now - l.open) / 400, 0, 1) : 0;
        if (t >= 1) continue;
        ctx.globalAlpha = fade * (1 - t);
        drawPadlock(ctx, l.u * W, l.v * H + t * t * H * 0.5, s * (1 + t * 0.3));
      }
      ctx.restore();
    },
  };
}

// ---------------------------------------------------------------- bugs: tap each twice
const BUG_WORDS = ['Sna', 'Fli', 'res', 'OV', 'Pl', 'Air', 'gh', 'he'];
const BUG_RECTS = ['#5A3D7A', '#7A5A9A', '#4A2D6A', '#6A4A8A', '#3A1D5A', '#8A6AAA'];

function bugFx(count) {
  const n = clamp(count, 1, 6);
  const bugs = Array.from({ length: n }, () => ({ u: rand(0.18, 0.82), v: rand(0.18, 0.82), taps: 2, phase: rand(0, 6.28), from: null, jumpAt: 0 }));
  const rects = Array.from({ length: 40 }, () => ({
    u: Math.random(), v: Math.random(), w: rand(40, 120), h: rand(25, 65), rot: (rand(-30, 30) * Math.PI) / 180,
    c: pick(BUG_RECTS), t: Math.random() > 0.4 ? pick(BUG_WORDS) : '',
  }));
  const st = { active: true, vortex: 0 };
  const R = (W) => 0.12 * W;

  function drawBug(ctx, x, y, r, b) {
    ctx.save();
    ctx.translate(x, y);
    ctx.save();
    ctx.rotate((st.vortex * Math.PI) / 180);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const hw = (8 * Math.PI) / 180;
      ctx.fillStyle = i % 2 ? 'rgba(136,51,170,0.25)' : 'rgba(170,68,204,0.376)';
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - hw) * r * 0.8, Math.sin(a - hw) * r * 0.8);
      ctx.lineTo(Math.cos(a) * r * 4, Math.sin(a) * r * 4);
      ctx.lineTo(Math.cos(a + hw) * r * 0.8, Math.sin(a + hw) * r * 0.8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.rotate((Math.sin(b.phase) * 5 * Math.PI) / 180);
    const sc = 1 + Math.sin(1.5 * b.phase) * 0.03;
    ctx.scale(sc, sc);
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 1.6 * r);
    glow.addColorStop(0.4, 'rgba(64,224,255,0.5)');
    glow.addColorStop(1, 'rgba(64,224,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 1.6 * r, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineCap = 'round';
    ctx.lineWidth = 0.08 * r;
    for (let layer = 8; layer >= 0; layer--) {
      const rr = r * (0.3 + layer * 0.08);
      const alpha = clamp(255 - layer * 20, 100, 255) / 255;
      ctx.strokeStyle = `rgba(64,200,232,${alpha})`;
      const strokes = 20 + layer * 4;
      ctx.beginPath();
      for (let s2 = 0; s2 < strokes; s2++) {
        const a = ((s2 * 360) / strokes + layer * 15) * (Math.PI / 180);
        ctx.moveTo(Math.cos(a) * (rr - 0.06 * r), Math.sin(a) * (rr - 0.06 * r));
        ctx.lineTo(Math.cos(a) * (rr + 0.06 * r), Math.sin(a) * (rr + 0.06 * r));
      }
      ctx.stroke();
    }
    ctx.fillStyle = '#50D0F0';
    ctx.beginPath();
    ctx.arc(0, 0, 0.5 * r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#80E0FF';
    ctx.fillStyle = '#80E0FF';
    ctx.lineWidth = 0.06 * r;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 0.15 * r, -0.4 * r);
      ctx.lineTo(side * 0.4 * r, -1.21 * r);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(side * 0.4 * r, -1.21 * r, 0.08 * r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#fff';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(side * 0.2 * r, -0.1 * r, 0.22 * r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#000';
    for (const px of [-0.15, 0.25]) {
      ctx.beginPath();
      ctx.arc(px * r, -0.05 * r, 0.11 * r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  return {
    get active() { return st.active; },
    animated: () => st.active,
    tap(p, W, H) {
      if (!st.active) return false;
      const r = R(W);
      const now = performance.now();
      const b = bugs.find((k) => k.taps > 0 && Math.hypot(p.x - k.u * W, p.y - k.v * H) <= r * 1.5);
      if (!b) return true;
      b.taps--;
      if (b.taps === 0) {
        Sound.play('squash');
        Sound.vibrate(25);
        if (bugs.every((k) => k.taps === 0)) st.active = false;
        return true;
      }
      Sound.play('buzz');
      const m = (r * 1.5) / W;
      const mv = (r * 1.5) / H;
      b.from = { u: b.u, v: b.v };
      b.jumpAt = now;
      b.u = b.from.u < 0.5 ? rand(0.5, 1 - m) : rand(m, 0.5);
      b.v = b.from.v < 0.5 ? rand(0.5, Math.max(0.5, 1 - mv)) : rand(Math.min(0.5, mv), 0.5);
      return true;
    },
    update(dt) {
      const f = dt / 16.67;
      st.vortex += 0.8 * f;
      for (const b of bugs) b.phase += 0.08 * f;
    },
    draw(ctx, W, H, now) {
      if (!st.active) return;
      ctx.save();
      ctx.fillStyle = 'rgba(58,21,96,0.733)';
      ctx.fillRect(0, 0, W, H);
      ctx.font = '800 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const rc of rects) {
        ctx.save();
        ctx.translate(rc.u * W, rc.v * H);
        ctx.rotate(rc.rot);
        ctx.fillStyle = rc.c;
        roundRect(ctx, -rc.w / 2, -rc.h / 2, rc.w, rc.h, 4);
        ctx.fill();
        if (rc.t) {
          ctx.fillStyle = '#fff';
          ctx.fillText(rc.t, 0, rc.h * 0.15);
        }
        ctx.restore();
      }
      const r = R(W);
      for (const b of bugs) {
        if (b.taps === 0) continue;
        let x = b.u * W;
        let y = b.v * H;
        if (b.jumpAt && now - b.jumpAt < 180) {
          const t = (now - b.jumpAt) / 180;
          x = lerp(b.from.u * W, x, t);
          y = lerp(b.from.v * H, y, t);
        }
        drawBug(ctx, x, y, r, b);
      }
      ctx.restore();
    },
  };
}

// ---------------------------------------------------------------- join screen
Screens.connect = {
  local: true,
  mount(ctx) {

      Sound.unlock();
      goImmersive();
      keepAwake();
      store.set('autojoin', ip);
      S.status = { state: 'connecting' };
      Net.raw({ op: 'connect', consoleIp: ip });
      render();
    };

      store.set('autojoin', null);
      Net.raw({ op: 'leave' });

      const st = S.status;

      } else {
        parts.push(h('b', { text: 'Tap your PlayStation to join' }));

      }

      parts.push(h('details', { class: 'details' },
        h('summary', { text: 'Console not listed?' }),
        h('div', { class: 'row', style: { marginTop: '8px' } }, ipInput,
          h('button', {
            class: 'btn small',
            text: 'Join',

      const w = S.welcome;
      if (w && !w.multiPlayer && w.playersConnected >= 1) {
        parts.push(h('p', { class: 'sub', text: 'This relay can host one phone only. Start kip-relay as administrator to let more people join.' }));
      }
      return h('div', { class: 'card col', style: { width: '100%' } }, parts);
    }

    function joiningCard() {
      const st = S.status.state;
      return h('div', { class: 'card col', style: { width: '100%', alignItems: 'center' } },
        h('div', { class: 'spinner' }),
        h('b', { text: st === 'connected' ? 'Joined! Waiting for the TV…' : 'Joining the game on the TV…' }),
        h('p', { class: 'sub', text: st === 'connected' ? 'The TV will ask for your name in a moment.' : 'This takes a few seconds.' }),
        h('button', { class: 'btn ghost small', text: 'Cancel', onclick: leave }));
    }

    function shareCard() {
      const url = S.welcome && S.welcome.shareUrl;
      if (!url) return null;
      return h('div', { class: 'card share' },
        h('div', { class: 'qr' }, qrSvg(url)),
        h('div', { class: 'col', style: { gap: '8px', minWidth: '0' } },
          h('b', { text: 'Friends scan this to join' }),
          h('div', { class: 'share-text', text: url }),
          h('button', { class: 'btn small', text: navigator.share ? 'Share link' : 'Copy link', onclick: () => shareLink(url) })));
    }

    function render() {
      const st = S.status.state;
      let main;
      if (S.noRelay) main = relayCard();
      else if (!S.linkUp && !S.welcome) {
        main = h('div', { class: 'card col', style: { width: '100%', alignItems: 'center' } },
          h('div', { class: 'spinner' }), h('b', { text: 'Connecting to the relay…' }),
          h('details', { class: 'details' }, h('summary', { text: 'Change relay address' }), relayCard()));
      } else if (st === 'connecting' || st === 'connected') main = joiningCard();
      else main = consoleList();
      body.replaceChildren(...header(), main, shareCard());
    }

    App.listen(scope, (what) => { if (what === 'relay' || what === 'status') render(); });
    scope.interval(() => {
      if (S.linkUp && !S.consoles.length && S.status.state !== 'connecting') Net.raw({ op: 'discover' });
    }, 4000);
    render();
    return { el };
  },
};

function qrSvg(text) {
  const { size, modules } = qrEncode(text);
  let d = '';
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (modules[y][x]) d += `M${x + 4},${y + 4}h1v1h-1z`;
  return s('svg', { viewBox: `0 0 ${size + 8} ${size + 8}`, 'shape-rendering': 'crispEdges' },
    s('rect', { width: size + 8, height: size + 8, fill: '#fff' }), s('path', { d, fill: '#000' }));
}

function shareLink(url) {
  if (navigator.share) {
    navigator.share({ title: 'Knowledge is Power', text: 'Join the quiz on the TV with your phone:', url }).catch(() => {});
    return;
  }
  const done = () => toast('Link copied');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(done, () => {});
    return;
  }
  const ta = h('textarea', { value: url, style: { position: 'fixed', opacity: '0' } });
  document.body.append(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch { toast(url, 5000); }
  ta.remove();
}

Screens.photo = {
  local: true,
  mount(ctx) {
    const { scope } = ctx;
    const canvas = hiCanvas();
    const empty = h('div', { class: 'ph-empty' }, h('div', { class: 'cam', text: '📷' }), h('div', { text: 'Tap to take a selfie' }));
    const mask = s('svg', { class: 'mask', viewBox: '0 0 100 100', preserveAspectRatio: 'none' });
    const box = h('div', { class: 'photo-box' }, canvas, mask, empty);
    const file = h('input', { type: 'file', accept: 'image/*', capture: 'user', class: 'hidden' });
    const grid = h('div', { class: 'avatar-grid' });
    const err = h('div', { class: 'err hidden' });
    const crop = S.photo && S.photo.crop ? S.photo.crop : { img: null, zoom: 1, cx: 0, cy: 0 };

    const takePhoto = () => { Sound.unlock(); file.click(); };
    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => {
        crop.img = img;
        crop.zoom = 1;
        crop.cx = img.naturalWidth / 2;
        crop.cy = img.naturalHeight * 0.45;
        S.photo = { crop, stub: false };
        draw();
        Sound.play('snap');
      };
      img.onerror = () => toast('Could not open that photo, try again');
      img.src = url;
      file.value = '';
    });

    function scaleFor(B) {
      const img = crop.img;
      return (B / Math.min(img.naturalWidth, img.naturalHeight)) * crop.zoom;
    }
    function clampCrop(B) {
      const img = crop.img;
      const sc = scaleFor(B);
      const half = B / 2 / sc;
      crop.cx = clamp(crop.cx, half, img.naturalWidth - half);
      crop.cy = clamp(crop.cy, half, img.naturalHeight - half);
    }
    function paint(ctx2, B) {
      const img = crop.img;
      clampCrop(B);
      const sc = scaleFor(B);
      ctx2.fillStyle = '#000';
      ctx2.fillRect(0, 0, B, B);
      ctx2.drawImage(img, B / 2 - crop.cx * sc, B / 2 - crop.cy * sc, img.naturalWidth * sc, img.naturalHeight * sc);
    }
    function draw() {
      empty.classList.toggle('hidden', !!crop.img || !!(S.photo && S.photo.stub));
      if (S.photo && S.photo.stub && !crop.img) {
        if (!canvas.fit()) return;
        const img = new Image();
        img.onload = () => { if (canvas.fit()) canvas.ctx.drawImage(img, 0, 0, canvas.cw, canvas.ch); };
        img.src = `data:image/jpeg;base64,${AVATAR_STUB_JPEG}`;
        return;
      }
      if (!crop.img || !canvas.fit()) return;
      paint(canvas.ctx, canvas.cw);
    }
    function exportJpeg() {
      if (!crop.img) return AVATAR_STUB_JPEG;
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const B = canvas.cw || 300;
      const cx = c.getContext('2d');
      cx.scale(512 / B, 512 / B);
      paint(cx, B);
      return c.toDataURL('image/jpeg', 0.85).split(',')[1];
    }

    // Face guide: the console puts the costume around the face, so keep the face in the oval.
    function drawMask() {
      mask.replaceChildren(
        s('path', { d: 'M0,0H100V100H0Z M50,10 a31,38 0 1,0 0.01,0 Z', 'fill-rule': 'evenodd', fill: 'rgba(0,0,0,0.42)' }),
        s('ellipse', { cx: 50, cy: 48, rx: 31, ry: 38, fill: 'none', stroke: '#F0EAD6', 'stroke-width': 1.2, 'stroke-dasharray': '3 2.4', opacity: 0.9 }));
    }

    // Pan with one finger, zoom with two (or the mouse wheel).
    const pointers = new Map();
    let pinch = null;
    scope.on(box, 'click', () => { if (!crop.img) takePhoto(); });
    scope.on(box, 'pointerdown', (e) => {
      if (!crop.img) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { box.setPointerCapture(e.pointerId); } catch { /* ignore */ }
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: crop.zoom };
      }
    });
    scope.on(box, 'pointermove', (e) => {
      const p = pointers.get(e.pointerId);
      if (!p || !crop.img) return;
      const dx = e.clientX - p.x;
      const dy = e.clientY - p.y;
      p.x = e.clientX;
      p.y = e.clientY;
      if (pointers.size === 2 && pinch) {
        const [a, b] = [...pointers.values()];
        crop.zoom = clamp(pinch.zoom * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d), 1, 4);
      } else if (pointers.size === 1) {
        const sc = scaleFor(canvas.cw);
        crop.cx -= dx / sc;
        crop.cy -= dy / sc;
      }
      draw();
    });
    const up = (e) => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
    };
    scope.on(box, 'pointerup', up);
    scope.on(box, 'pointercancel', up);
    scope.on(box, 'wheel', (e) => {
      if (!crop.img) return;
      e.preventDefault();
      crop.zoom = clamp(crop.zoom * (e.deltaY < 0 ? 1.08 : 0.93), 1, 4);
      draw();
    }, { passive: false });

    function renderAvatars() {
      grid.replaceChildren();
      if (!S.avatars.length) {
        grid.append(h('div', { class: 'row', style: { gridColumn: '1 / -1', gap: '10px' } }, h('div', { class: 'spinner' }), h('span', { text: 'Waiting for avatars…' })));
        return;
      }
      for (const a of S.avatars) {
        const mine = a.AvatarID === S.selectedAvatar && S.avatarConfirmed;
        const pending = a.AvatarID === S.pendingAvatar;
        const taken = !a.Available && !mine && !pending;
        const status = mine ? 'Selected' : pending ? 'Asking' : taken ? 'Taken' : 'Available';
        grid.append(h('button', {
          class: `avatar${mine ? ' sel' : ''}${taken ? ' taken' : ''}${pending ? ' pending' : ''}`,
          onclick: () => {
            Sound.unlock();
            if (taken) { toast('Another player has that avatar'); Sound.play('wrong'); return; }
            if (mine || pending) return;
            Sound.play('tap');
            requestAvatar(a.AvatarID);
          },
        }, avatarIcon(a.AvatarID), h('span', { text: avatarLabel(a.AvatarID) }), h('span', { class: 'st', text: status })));
      }
    }

    const submit = () => {
      const hasPhoto = !!crop.img || !!(S.photo && S.photo.stub);
      if (!hasPhoto) { err.textContent = 'Take a photo first'; err.classList.remove('hidden'); Sound.play('wrong'); return; }
      if (!S.avatarConfirmed || !S.selectedAvatar) { err.textContent = 'Pick an avatar first'; err.classList.remove('hidden'); Sound.play('wrong'); return; }
      Sound.play('select');
      const jpeg = exportJpeg();
      const guid = uuid();
      S.photo = { ...(S.photo || {}), crop, guid, url: `data:image/jpeg;base64,${jpeg}` };
      Net.image(guid, 2, jpeg);
      App.send({
        TypeString: 'ClientPlayerProfileMessage',
        playerName: S.name,
        uppercasePlayerName: S.name.toUpperCase(),
        deviceCultureName: 'en-US',
        playerCardId: S.selectedAvatar,
      });
      Net.image(guid, 3, jpeg);
      App.show('waiting');
    };

    const el = h('div', { class: 'lobby' },
      h('div', { class: 'lobby-inner', style: { maxWidth: '980px' } },
        h('div', { class: 'photo-layout' },
          h('div', { class: 'col', style: { alignItems: 'center' } },
            box,
            h('div', { class: 'row' },
              h('button', { class: 'btn small', text: 'Take photo', onclick: takePhoto }),
              h('button', {
                class: 'btn ghost small',
                text: 'No photo',
                onclick: () => { crop.img = null; S.photo = { crop, stub: true }; draw(); },
              })),
            h('div', { class: 'sub', style: { fontSize: '13px' }, text: 'Drag to move, pinch to zoom. Keep your face in the oval.' })),
          h('div', { class: 'col', style: { flex: '1', minWidth: '0' } },
            h('h1', { class: 'title', style: { textAlign: 'left', fontSize: '24px' }, text: `Hi ${S.name}! Pick your avatar` }),
            grid, err,
            h('button', { class: 'btn primary', text: 'Continue', onclick: submit })))),
      file);

    App.listen(scope, (what) => {
      if (what === 'avatars') {
        renderAvatars();
        if (S.avatarConfirmed) err.classList.add('hidden');
      }
    });
    scope.resize(box, draw);
    drawMask();
    renderAvatars();
    if (S.selectedAvatar && !S.avatarConfirmed && !S.pendingAvatar) {
      const a = S.avatars.find((x) => x.AvatarID === S.selectedAvatar);
      if (a && a.Available) requestAvatar(a.AvatarID);
    }
    return { el, ready: draw };
  },
};

// ---------------------------------------------------------------- waiting room
function startButton(scope, onDone) {
  const lights = [];
  const svg = s('svg', { viewBox: '0 0 300 300' });
  svg.append(s('circle', { cx: 150, cy: 150, r: 148, fill: '#1E1E1E' }));
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 - Math.PI / 2;
    const c = s('circle', { cx: 150 + Math.cos(a) * 122, cy: 150 + Math.sin(a) * 122, r: 8, fill: '#333333' });
    lights.push(c);
    svg.append(c);
  }
  const circ = 2 * Math.PI * 138;
  const arc = s('circle', {
    cx: 150, cy: 150, r: 138, fill: 'none', stroke: '#FFEB3B', 'stroke-width': 12, 'stroke-linecap': 'round',
    'stroke-dasharray': `0 ${circ}`, transform: 'rotate(-90 150 150)',
  });
  svg.append(arc);
  const inner = s('circle', { cx: 150, cy: 150, r: 98, fill: '#4CAF50' });
  svg.append(inner, s('text', {
    x: 150, y: 162, 'text-anchor': 'middle', fill: '#fff', 'font-size': 38, 'font-weight': 900, style: 'font-family: inherit', text: 'START',
  }));
  const el = h('div', { class: 'start-btn' }, svg);

  let p = 0;
  let holding = false;
  let releaseFrom = 0;
  let lit = 0;
  let done = false;
  scope.loop((dt) => {
    if (done) return false;
    if (holding) p = Math.min(1, p + dt / 2000);
    else if (p > 0) p = Math.max(0, p - (releaseFrom * dt) / 200);
    const n = Math.floor(p * 16 + 1e-6);
    if (n > lit && holding) { Sound.play('light'); Sound.vibrate(8); }
    lit = n;
    lights.forEach((c, i) => c.setAttribute('fill', i < n ? '#FFEB3B' : '#333333'));
    arc.setAttribute('stroke-dasharray', `${p * circ} ${circ}`);
    inner.setAttribute('fill', holding ? '#43A047' : '#4CAF50');
    if (p >= 1) {
      done = true;
      Sound.play('go');
      Sound.vibrate([30, 40, 60]);
      onDone();
      return false;
    }
    return true;
  });
  const down = (e) => { e.preventDefault(); Sound.unlock(); holding = true; try { el.setPointerCapture(e.pointerId); } catch { /* ignore */ } };
  const up = () => { if (holding) { holding = false; releaseFrom = p; } };
  scope.on(el, 'pointerdown', down);
  scope.on(el, 'pointerup', up);
  scope.on(el, 'pointercancel', up);
  scope.on(el, 'contextmenu', (e) => e.preventDefault());
  return el;
}

// ---------------------------------------------------------------- holding screen (retro TV)
function holdingColours() {
  const c = S.colours;
  const bg = c && !isBlackTint(c.BackgroundTint) ? tintHex(c.BackgroundTint) : '#C4B8A8';
  const sec = c && !isBlackTint(c.SecondaryTint) ? tintHex(c.SecondaryTint) : '#D4C8B8';
  const fill = c && !isBlackTint(c.PrimaryTint) ? rgba(tintHex(c.PrimaryTint), c.PrimaryTint.a ?? 1) : 'transparent';
  return { bg, sec, fill };
}

function holdingText(m, stale) {
  if (stale || !m) return 'Look at the TV';
  const t = String(m.HoldingScreenText || '').replace(/\\n/g, '\n').trim();
  if (t) return t;
  return m.HoldingScreenType === 9 ? 'Get Ready!' : 'Look at the TV';
}

function scallopPath(x0, y0, x1, y1, step) {
  const pts = [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]];
  let d = `M${x0},${y0}`;
  for (let i = 0; i < 4; i++) {
    const [ax, ay] = pts[i];
    const [bx, by] = pts[i + 1];
    const len = Math.hypot(bx - ax, by - ay);
    const n = Math.max(1, Math.round(len / step));
    const r = (len / n) * 0.62;
    for (let k = 1; k <= n; k++) d += `A${r},${r} 0 0 1 ${(ax + ((bx - ax) * k) / n).toFixed(2)},${(ay + ((by - ay) * k) / n).toFixed(2)}`;
  }
  return `${d}Z`;
}

function retroTv() {
  const frame = s('path', { d: scallopPath(3, 3, 67, 47, 4.4), fill: 'transparent', stroke: '#F0EAD6', 'stroke-width': 1.6, 'stroke-linejoin': 'round' });
  const svg = s('svg', { viewBox: '0 0 70 50', style: 'position:absolute;inset:0;width:100%;height:100%;overflow:visible' },
    s('path', { d: 'M35,3 L23,-13 M35,3 L48,-12', stroke: '#F0EAD6', 'stroke-width': 1.4, 'stroke-linecap': 'round', fill: 'none' }),
    s('circle', { cx: 23, cy: -13, r: 1.8, fill: '#F0EAD6' }),
    s('circle', { cx: 48, cy: -12, r: 1.8, fill: '#F0EAD6' }),
    s('path', { d: 'M28,3 A7,5 0 0 1 42,3', fill: '#F0EAD6' }),
    s('path', { d: 'M16,47 L12,55 M54,47 L58,55', stroke: '#F0EAD6', 'stroke-width': 1.6, 'stroke-linecap': 'round' }),
    frame,
    s('rect', { x: 7.5, y: 7.5, width: 55, height: 35, rx: 5, fill: 'none', stroke: '#F0EAD6', 'stroke-width': 0.7, opacity: 0.55 }));
  const text = h('div', {
    style: {
      position: 'absolute', left: '7.5%', right: '7.5%', top: '12%', bottom: '12%', display: 'flex', alignItems: 'center', justifyContent: 'center',
      textAlign: 'center', color: '#F0EAD6', fontWeight: '900', lineHeight: '1.1', whiteSpace: 'pre-line', textShadow: '1px 1px 2px rgba(0,0,0,.5)', overflow: 'hidden',
    },
  });
  const box = h('div', { style: { position: 'absolute', left: '50%', top: '50%' } }, svg, text);
  const el = h('div', { class: 'layer' }, box);
  let size = 0;
  el.layout = () => {
    const W = el.clientWidth;
    const H = el.clientHeight;
    // The original used 0.6 × the short side, which leaves the TV tiny on a landscape phone.
    size = Math.min(0.6 * W, 0.9 * H);
    Object.assign(box.style, {
      width: `${0.7 * size}px`, height: `${0.5 * size}px`,
      transform: `translate(-50%, -50%) translateY(${0.1 * size}px) rotate(-10deg) scaleX(1.2)`,
    });
    text.style.fontSize = `${0.1 * size}px`;
    fitText(text, 0.1 * size, 8);
  };
  el.setText = (t) => { text.textContent = t; if (size) fitText(text, 0.1 * size, 8); };
  el.setFill = (f) => frame.setAttribute('fill', f);
  return el;
}

Screens.holding = {
  game: true,
  mount(ctx) {
    const { scope } = ctx;
    const c = holdingColours();
    const bg = sunburst(c.bg, c.sec);
    const tv = retroTv();

};

const DOOR_SHAPES = [
  'M8,158 L8,62 Q8,24 50,4 Q92,24 92,62 L92,158 Z',
  'M8,158 L8,52 A42,46 0 0 1 92,52 L92,158 Z',
  'M8,158 L8,40 Q8,28 18,26 Q22,10 36,14 Q50,0 64,14 Q78,10 82,26 Q92,28 92,40 L92,158 Z',

];

function doorSvg(style, colour) {
  const base = colour || '#8B5A2B';
  const doorCol = blend(base, '#5C4033', 0.5);
  const frameCol = blend(base, '#FFFFFF', 0.7);
  const shape = DOOR_SHAPES[style % 4];
  const svg = s('svg', { viewBox: '0 -4 100 166', preserveAspectRatio: 'xMidYMax meet' },
    s('path', { d: shape, fill: frameCol, stroke: '#D4AF37', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }),
    s('g', { transform: 'translate(50 158) scale(0.8 0.86) translate(-50 -158)' },
      s('path', { d: shape, fill: doorCol, stroke: shade(doorCol, 0.7), 'stroke-width': 2 }),
      s('path', { d: 'M34,40 V156 M50,30 V156 M66,40 V156', stroke: shade(doorCol, 0.8), 'stroke-width': 1.4, opacity: 0.6 }),
      s('rect', { x: 18, y: 90, width: 64, height: 5, fill: shade(doorCol, 0.75), opacity: 0.7 }),
      s('circle', { cx: 74, cy: 108, r: 4.2, fill: '#D4AF37', stroke: '#8a6d1a', 'stroke-width': 1 })),
    s('rect', { x: 4, y: 156, width: 92, height: 4, rx: 2, fill: '#D4AF37' }));
  for (let i = 0; i < 31; i++) {
    const g = s('circle', {
      cx: rand(10, 90).toFixed(1), cy: rand(20, 154).toFixed(1), r: rand(0.6, 1.6).toFixed(2), fill: '#FFFACD',
      style: `animation: twinkle ${rand(1.2, 2.8).toFixed(2)}s ease-in-out ${rand(0, 2).toFixed(2)}s infinite`,
    });
    svg.append(g);
  }
  return svg;
}

function choiceTints(msg) {
  const bg = msg && msg.BackgroundTint && !isBlackTint(msg.BackgroundTint) ? tintHex(msg.BackgroundTint) : '#C4B8A8';
  const sec = msg && msg.SecondaryTint && !isBlackTint(msg.SecondaryTint) ? tintHex(msg.SecondaryTint) : '#D4C8B8';
  return [bg, sec];
}

Screens.category = {
  game: true,
  mount(ctx) {
    let msg = ctx.msg;
    const prior = ctx.sent('ClientCategorySelectChoice');
    let chosen = prior ? prior.ChosenCategoryIndex : null;
    if (chosen === -1) chosen = null;
    const bg = sunburst(...choiceTints(msg));
    const doors = h('div', { class: 'doors' });
    const el = h('div', {}, bg, h('div', { class: 'layer center', style: { justifyContent: 'flex-start' } },
      h('div', { class: 'cat-title', text: 'CHOOSE A CATEGORY' }), doors));

    const sendChoice = (i) => App.send({ TypeString: `${KIP}ClientCategorySelectChoice`, ChosenCategoryIndex: i });

    function render() {
      const choices = (msg && msg.CategoryChoices) || [];
      doors.replaceChildren();
      for (let i = 0; i < 4; i++) {
        const c = choices[i];
        const col = h('div', { class: `door-col${c ? '' : ' invisible'}` },
          h('div', { class: 'lbl', text: c ? String(c.DisplayText || '').replace(/\\n/g, '\n') : '' }),
          doorSvg(i, c && c.Colour ? tintHex(c.Colour) : null));
        if (chosen != null) col.style.opacity = i === chosen ? '1' : '0.3';
        col.addEventListener('click', () => {
          if (chosen != null || !c) return;
          chosen = i;
          Sound.play('select');
          Sound.vibrate(15);
          sendChoice(i);
          render();
        });
        doors.append(col);
      }
    }
    render();

    if (S.categoryRequestPending) {
      S.categoryRequestPending = false;
      sendChoice(chosen ?? -1);
    }
    return {
      el,
      onMsg(m, type) {
        if (type === 'ServerRequestCategorySelectChoice') {
          sendChoice(chosen ?? -1);
          return true;
        }
        if (type === 'ServerCategorySelectChoices') {
          msg = m;
          if (m.BackgroundTint) bg.setColors(...choiceTints(m));
          render();
          return true;
        }
        return false;
      },
    };
  },
};

        s('svg', { viewBox: '0 0 100 100' },

        h('div', { style: { width: 'min(60vw, 320px)', height: '6px', background: 'rgba(0,0,0,.25)', borderRadius: '3px', marginTop: '6px' } }, bar));

Screens.trivia = {
  game: true,
  duration: (m) => m.QuestionDuration || 0,
  answerType: 'ClientTriviaAnswer',
  mount(ctx) {
    const { scope } = ctx;
    const msg = ctx.msg;
    const finals = msg.RoundType === 5;
    const bgA = msg.BackgroundTint ? tintHex(msg.BackgroundTint) : '#333333';
    const bgB = msg.SecondaryTint ? tintHex(msg.SecondaryTint) : '#222222';
    const byIndex = new Map((msg.Answers || []).map((a) => [a.DisplayIndex, a]));
    const prior = ctx.sent('ClientTriviaAnswer');
    let answered = !!prior;
    let wrongCount = 0;
    let penalty = false;

    const cells = [];
    const grid = h('div', { class: 'grid' });
    for (let r = 0; r < 2; r++) {
      const row = h('div', { class: 'grid-row' });
      for (let c = 0; c < 2; c++) {
        const i = r * 2 + c;
        const a = byIndex.get(i);
        const btn = h('button', { class: 'answer', tabIndex: -1, text: a ? a.DisplayText : '' });
        const canvas = hiCanvas('ov');
        canvas.style.pointerEvents = 'none';
        const cell = h('div', { class: `cell${a ? '' : ' invisible'}` }, btn, canvas);
        cells.push({ i, a, btn, canvas, el: cell, fx: [], rect: null });
        row.append(cell);
      }
      grid.append(row);
    }
    const fxCanvas = hiCanvas('full');
    fxCanvas.style.pointerEvents = 'none';
    const wrongFlash = h('div', { class: 'full wrong-flash hidden' });
    const boom = h('div', { class: 'full boom hidden', text: "Don't touch the bombs!" });
    const input = h('div', { class: 'full', style: { touchAction: 'none' } });
    const el = h('div', {},
      sunburst(bgA, bgB),
      h('div', { class: 'layer trivia' },
        h('div', { class: 'q', text: msg.QuestionText || '' }),
        finals ? h('div', { class: 'finals', text: 'Finals! Wrong answers are rejected!' }) : null,
        grid),
      fxCanvas, wrongFlash, boom, input);

    const highlight = (idx) => cells.forEach((c) => { c.el.style.opacity = c.i === idx ? '1' : '0.3'; });
    if (prior) highlight(prior.ChosenAnswerDisplayIndex);

    const sendAnswer = (displayIndex, time) => App.send({
      TypeString: `${KIP}ClientTriviaAnswer`,
      ChosenAnswerDisplayIndex: displayIndex,
      AnswerTime: time,
      NumBombsExploded: 0,
      PaintCleared: false,
      IceCleared: false,
      NumWrongAnswers: wrongCount,
      TotalPaintLayersPerAnswer: 0,
      PaintLayersClearedAnswer0: 0,
      PaintLayersClearedAnswer1: 0,
      PaintLayersClearedAnswer2: 0,
      PaintLayersClearedAnswer3: 0,
      TotalIceLayersPerAnswer: 0,
      IceLayersClearedAnswer0: 0,
      IceLayersClearedAnswer1: 0,
      IceLayersClearedAnswer2: 0,
      IceLayersClearedAnswer3: 0,
    });

    function blockFor(overlay, ms) {
      penalty = true;
      overlay.classList.remove('hidden');
      scope.timeout(() => {
        overlay.classList.add('hidden');
        penalty = false;
      }, ms);
    }

    function choose(cell) {
      if (answered || penalty || !cell || !cell.a) return;
      if (finals && !cell.a.IsCorrect) {
        wrongCount++;
        Sound.play('wrong');
        Sound.vibrate([40, 30, 40]);
        blockFor(wrongFlash, 1900);
        return;
      }
      answered = true;
      Sound.play('select');
      Sound.vibrate(15);
      highlight(cell.i);
      sendAnswer(cell.a.DisplayIndex, Math.round(ctx.elapsedSec() * 1000) / 1000);
    }

    // ------------------------------------------------ effects
    const counts = powerCounts(msg.PowerPlays);
    const screenFx = [];
    let disco = null;
    let bombles = null;
    let lockdown = null;
    let bugs = null;
    function setupFx() {
      if (answered) return;
      const fontMax = parseFloat(getComputedStyle(cells[0].btn).fontSize) || 34;
      for (const cell of cells) {
        if (!cell.a) continue;
        if (counts[PT.LETTER_SCATTER] > 0) cell.fx.push(textFx(cell.a.DisplayText, { scatter: true, bites: counts[PT.NIBBLERS] > 0 ? 2 + 2 * counts[PT.NIBBLERS] : 0, maxFont: fontMax }));
        else if (counts[PT.NIBBLERS] > 0) cell.fx.push(textFx(cell.a.DisplayText, { bites: 2 + 2 * counts[PT.NIBBLERS], maxFont: Math.min(42, fontMax * 1.2) }));
        if (cell.fx.length) cell.btn.style.color = 'transparent';
        if (counts[PT.FREEZE] > 0) cell.ice = iceFx(counts[PT.FREEZE]);
        if (counts[PT.GLOOP] > 0) cell.gloop = gloopFx(counts[PT.GLOOP]);
        if (counts[PT.ZIPPERS] > 0) cell.zip = zipperFx(counts[PT.ZIPPERS]);
        for (const k of ['ice', 'gloop', 'zip']) if (cell[k]) cell.fx.push(cell[k]);
      }
      if (counts[PT.DISCO] > 0) screenFx.push(disco = discoFx());
      if (counts[PT.BOMBLES] > 0) screenFx.push(bombles = bomblesFx(counts[PT.BOMBLES], el.clientWidth, el.clientHeight));
      if (counts[PT.LOCKDOWN] > 0) screenFx.push(lockdown = lockdownFx(counts[PT.LOCKDOWN] * 3));
      if (counts[PT.BUG] > 0) screenFx.push(bugs = bugFx(counts[PT.BUG]));
    }

    function layout() {
      for (const c of cells) {
        c.rect = rectOf(c.el, el);
        c.canvas.fit();
        c.dirty = true;
      }
      fxCanvas.fit();
    }

    scope.loop((dt, now) => {
      const W = fxCanvas.cw;
      const H = fxCanvas.ch;
      for (const c of cells) {
        if (!c.fx.length) continue;
        const live = c.fx.some((f) => f.active || (f.animated && f.animated()));
        const anim = c.fx.some((f) => f.animated && f.animated());
        if (!c.dirty && !anim && !c.wasLive) continue;
        c.dirty = false;
        c.wasLive = live && anim;
        const { ctx: g, cw, ch } = c.canvas;
        if (!g) continue;
        g.clearRect(0, 0, cw, ch);
        for (const f of c.fx) f.draw(g, cw, ch, now);
      }
      if (fxCanvas.ctx && (screenFx.length || fxCanvas.wasDrawn)) {
        const g = fxCanvas.ctx;
        g.clearRect(0, 0, W, H);
        fxCanvas.wasDrawn = false;
        for (const f of screenFx) {
          if (f.update) f.update(dt, W, H, now);
          if (f.active !== false) {
            f.draw(g, W, H, now);
            fxCanvas.wasDrawn = true;
          }
        }
      }
    });

    // ------------------------------------------------ input, routed top layer first
    const cellAt = (p) => cells.find((c) => c.a && c.rect && inRect(p, c.rect)) || null;
    const local = (c, p) => ({ x: p.x - c.rect.x, y: p.y - c.rect.y });
    const gloopActive = () => cells.some((c) => c.gloop && c.gloop.active);
    let gesture = null;

    function bombHit(p) {
      if (!bombles || answered || penalty) return false;
      const b = bombles.hit(p);
      if (!b) return false;
      bombles.explode(b);
      Sound.play('boom');
      Sound.vibrate([60, 40, 80]);
      blockFor(boom, 1900);
      gesture = null;
      return true;
    }

    // A tap that reached the answers: zippers and ice take it before the button does.
    function tapCell(c, p) {
      if (!c) return;
      if (c.zip && c.zip.active) return;
      if (c.ice && c.ice.active) {
        const l = local(c, p);
        c.ice.tap(l.x / c.rect.w, l.y / c.rect.h);
        c.dirty = true;
        return;
      }
      choose(c);
    }

    scope.on(input, 'pointerdown', (e) => {
      Sound.unlock();
      if (answered || penalty || gesture) return;
      const p = localPoint(e, el);
      try { input.setPointerCapture(e.pointerId); } catch { /* ignore */ }
      if (bugs && bugs.active) { bugs.tap(p, fxCanvas.cw, fxCanvas.ch); return; }
      if (lockdown && lockdown.active) { lockdown.tap(p, fxCanvas.cw, fxCanvas.ch); return; }
      if (bombHit(p)) return;
      const c = cellAt(p);
      gesture = { id: e.pointerId, start: p, moved: false, cell: c, gloop: gloopActive(), zip: null, lastGloop: null };
      if (c && c.zip && c.zip.active) {
        const l = local(c, p);
        const g = c.zip.grab(l.x, l.y, c.rect.w, c.rect.h);
        if (g) { gesture.zip = g; return; }
      }
      if (gesture.gloop) {
        wipe(p, true);
        return;
      }
      if (c && ((c.zip && c.zip.active) || (c.ice && c.ice.active))) {
        tapCell(c, p);
        gesture.consumed = true;
      }
    });

    function wipe(p, newContact) {
      const c = cellAt(p);
      if (!c || !c.gloop || !c.gloop.active) {
        if (gesture) gesture.lastGloop = null;
        return;
      }
      const l = local(c, p);
      c.gloop.wipe(l.x / c.rect.w, l.y / c.rect.h, c.rect.w, c.rect.h, newContact || gesture.lastGloop !== c);
      gesture.lastGloop = c;
      c.dirty = true;
    }

    scope.on(input, 'pointermove', (e) => {
      if (!gesture || e.pointerId !== gesture.id) return;
      const p = localPoint(e, el);
      if (Math.hypot(p.x - gesture.start.x, p.y - gesture.start.y) > 20) gesture.moved = true;
      if (bombHit(p)) return;
      if (gesture.zip) {
        const c = gesture.cell;
        c.zip.drag(gesture.zip, local(c, p).x, c.rect.w);
        c.dirty = true;
        return;
      }
      if (gesture.gloop) wipe(p, false);
    });

    const finish = (e, cancelled) => {
      if (!gesture || e.pointerId !== gesture.id) return;
      const g = gesture;
      gesture = null;
      cells.forEach((c) => c.gloop && c.gloop.endContact());
      if (g.zip) {
        g.cell.zip.release();
        g.cell.dirty = true;
        return;
      }
      if (cancelled || g.moved || g.consumed) return;
      const p = localPoint(e, el);
      const c = cellAt(p);
      if (c && c === g.cell) tapCell(c, p);
    };
    scope.on(input, 'pointerup', (e) => finish(e, false));
    scope.on(input, 'pointercancel', (e) => finish(e, true));

    // ------------------------------------------------ timer
    if (!answered) {
      scope.timeout(() => {
        if (answered) return;
        answered = true;
        sendAnswer(-1, msg.QuestionDuration);
      }, ctx.remainingMs(msg.QuestionDuration || 0));
    }

    scope.resize(el, layout);
    return {
      el,
      ready() {
        layout();
        setupFx();
        layout();
      },
    };
  },
};
