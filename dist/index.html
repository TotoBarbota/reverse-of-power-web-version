<style>:root {
  --eggshell: #F0EAD6;
  --ink: #333333;
  --teal: #4DB6AC;
  --rose: #C85080;
  --gold: #D4AF37;
  --night: #2a1257;
  --shadow: 2px 2px 3px rgba(0, 0, 0, .5);
  --shadow-sm: 1px 1px 2px rgba(0, 0, 0, .5);
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); }
body {
  font-family: var(--font);
  color: #fff;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}
button, input { font: inherit; }
button { cursor: pointer; }

#app { position: fixed; inset: 0; overflow: hidden; }
.screen {
  position: absolute; inset: 0; overflow: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen.enter { animation: screen-in .22s ease-out; }
@keyframes screen-in { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }
.layer { position: absolute; inset: 0; }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.shadow { text-shadow: var(--shadow); }
.shadow-sm { text-shadow: var(--shadow-sm); }
.hidden { display: none !important; }
.invisible { visibility: hidden !important; }

/* ---------- backgrounds ---------- */
.sunburst { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, var(--sb1, #C4B8A8) 0deg 15deg, var(--sb2, #D4C8B8) 15deg 30deg); }
.sunburst-wrap { position: absolute; inset: 0; overflow: hidden; }
.sunburst-wrap::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, .333); }
.whirlpool { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* ---------- common widgets ---------- */
.btn {
  border: 0; border-radius: 999px; padding: 14px 28px; min-height: 48px;
  background: var(--eggshell); color: var(--ink); font-weight: 800; font-size: 18px; letter-spacing: .02em;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .25), 0 6px 18px rgba(0, 0, 0, .25);
  transition: transform .08s, opacity .2s;
}
.btn:active { transform: translateY(2px) scale(.98); }
.btn[disabled], .btn.dim { opacity: .55; }
.btn.primary { background: #4CAF50; color: #fff; text-shadow: var(--shadow-sm); }
.btn.ghost { background: rgba(255, 255, 255, .14); color: #fff; box-shadow: none; }
.btn.small { min-height: 38px; padding: 8px 16px; font-size: 15px; }

// Minimal QR Code encoder (byte mode, error correction level M, versions 1-10).
// Follows the structure of Project Nayuki's QR Code generator (MIT).
// Exposes qrEncode(text) -> { size, modules } where modules[y][x] is true for dark.

function qrEncode(text) {
  const ECC_PER_BLOCK = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const NUM_BLOCKS = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const data = Array.from(new TextEncoder().encode(text));

  const rawModules = (ver) => {
    let result = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const numAlign = Math.floor(ver / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (ver >= 7) result -= 36;
    }
    return result;
  };
  const dataCodewords = (ver) => Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ver] * NUM_BLOCKS[ver];

  let version = 1;
  for (; version <= 10; version++) {
    const countBits = version < 10 ? 8 : 16;
    if (4 + countBits + data.length * 8 <= dataCodewords(version) * 8) break;
  }
  if (version > 10) throw new Error('Text too long for QR code');

  const bits = [];
  const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  push(4, 4);
  push(data.length, version < 10 ? 8 : 16);
  data.forEach((b) => push(b, 8));
  const capacity = dataCodewords(version) * 8;
  push(0, Math.min(4, capacity - bits.length));
  push(0, (8 - (bits.length % 8)) % 8);
  for (let pad = 0xec; bits.length < capacity; pad ^= 0xec ^ 0x11) push(pad, 8);
  const codewords = [];
  for (let i = 0; i < bits.length; i += 8) codewords.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));

  const gfMul = (x, y) => {
    let z = 0;

      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  };
  const rsDivisor = (degree) => {
    const result = new Array(degree).fill(0);
    result[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < result.length; j++) {
        result[j] = gfMul(result[j], root);
        if (j + 1 < result.length) result[j] ^= result[j + 1];
      }
      root = gfMul(root, 0x02);
    }
    return result;
  };
  const rsRemainder = (msg, divisor) => {
    const result = divisor.map(() => 0);
    for (const b of msg) {
      const factor = b ^ result.shift();
      result.push(0);
      divisor.forEach((coef, i) => { result[i] ^= gfMul(coef, factor); });
    }
    return result;
  };

  const numBlocks = NUM_BLOCKS[version];
  const blockEccLen = ECC_PER_BLOCK[version];
  const rawCodewords = Math.floor(rawModules(version) / 8);
  const numShortBlocks = numBlocks - (rawCodewords % numBlocks);
  const shortBlockLen = Math.floor(rawCodewords / numBlocks);
  const blocks = [];
  const divisor = rsDivisor(blockEccLen);
  for (let i = 0, k = 0; i < numBlocks; i++) {
    const dat = codewords.slice(k, k + shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1));
    k += dat.length;
    const ecc = rsRemainder(dat, divisor);
    if (i < numShortBlocks) dat.push(-1);
    blocks.push(dat.concat(ecc));
  }
  const allCodewords = [];
  for (let i = 0; i < blocks[0].length; i++) {
    blocks.forEach((block, j) => {
      if (i !== shortBlockLen - blockEccLen || j >= numShortBlocks) allCodewords.push(block[i]);
    });
  }

  const size = version * 4 + 17;
  const modules = Array.from({ length: size }, () => new Array(size).fill(false));
  const isFunction = Array.from({ length: size }, () => new Array(size).fill(false));
  const setFunction = (x, y, dark) => { modules[y][x] = dark; isFunction[y][x] = true; };

  for (let i = 0; i < size; i++) {
    setFunction(6, i, i % 2 === 0);
    setFunction(i, 6, i % 2 === 0);
  }
  const finder = (cx, cy) => {
    for (let dy = -4; dy <= 4; dy++) {
      for (let dx = -4; dx <= 4; dx++) {
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        const x = cx + dx;
        const y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setFunction(x, y, dist !== 2 && dist !== 4);
      }
    }
  };
  finder(3, 3);
  finder(size - 4, 3);
  finder(3, size - 4);

  if (version >= 2) {
    const numAlign = Math.floor(version / 7) + 2;
    const step = Math.ceil((version * 4 + 4) / (numAlign * 2 - 2)) * 2;
    const positions = [6];
    for (let pos = size - 7; positions.length < numAlign; pos -= step) positions.splice(1, 0, pos);
    const last = positions.length - 1;
    positions.forEach((py, i) => positions.forEach((px, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) setFunction(px + dx, py + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }));
  }

  const drawFormat = (mask) => {
    const formatData = (0 << 3) | mask;
    let rem = formatData;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const fbits = ((formatData << 10) | rem) ^ 0x5412;
    const bit = (i) => ((fbits >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) setFunction(8, i, bit(i));
    setFunction(8, 7, bit(6));
    setFunction(8, 8, bit(7));
    setFunction(7, 8, bit(8));
    for (let i = 9; i < 15; i++) setFunction(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) setFunction(size - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) setFunction(8, size - 15 + i, bit(i));
    setFunction(8, size - 8, true);
  };
  drawFormat(0);

  if (version >= 7) {
    let rem = version;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    const vbits = (version << 12) | rem;
    for (let i = 0; i < 18; i++) {
      const dark = ((vbits >>> i) & 1) !== 0;
      const a = size - 11 + (i % 3);
      const b = Math.floor(i / 3);
      setFunction(a, b, dark);
      setFunction(b, a, dark);
    }
  }

  let bitIndex = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const x = right - j;
        const upward = ((right + 1) & 2) === 0;
        const y = upward ? size - 1 - vert : vert;
        if (!isFunction[y][x] && bitIndex < allCodewords.length * 8) {
          modules[y][x] = ((allCodewords[bitIndex >>> 3] >>> (7 - (bitIndex & 7))) & 1) !== 0;
          bitIndex++;
        }
      }
    }
  }

  const maskFn = [
    (x, y) => (x + y) % 2 === 0,
    (x, y) => y % 2 === 0,
    (x) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
    (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
    (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
    (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
  ];
  const applyMask = (mask) => {
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (!isFunction[y][x] && maskFn[mask](x, y)) modules[y][x] = !modules[y][x];
      }
    }
  };
  const penalty = () => {
    let score = 0;
    for (let a = 0; a < size; a++) {
      let runRow = 1;
      let runCol = 1;
      for (let b = 1; b < size; b++) {
        if (modules[a][b] === modules[a][b - 1]) { runRow++; if (runRow === 5) score += 3; else if (runRow > 5) score++; } else runRow = 1;
        if (modules[b][a] === modules[b - 1][a]) { runCol++; if (runCol === 5) score += 3; else if (runCol > 5) score++; } else runCol = 1;
      }
    }
    for (let y = 0; y < size - 1; y++) {
      for (let x = 0; x < size - 1; x++) {
        const c = modules[y][x];
        if (c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) score += 3;
      }
    }
    const dark = modules.flat().filter(Boolean).length;
    const total = size * size;
    score += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
    return score;
  };

  let bestMask = 0;
  let bestScore = Infinity;
  for (let mask = 0; mask < 8; mask++) {
    applyMask(mask);
    drawFormat(mask);
    const score = penalty();
    if (score < bestScore) { bestScore = score; bestMask = mask; }
    applyMask(mask);
  }
  applyMask(bestMask);
  drawFormat(bestMask);
  return { size, modules };
}

// ---------------------------------------------------------------- DOM helpers
const SVGNS = 'http://www.w3.org/2000/svg';

function build(el, props, kids) {
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.setAttribute('class', v);
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') {
        for (const [sk, sv] of Object.entries(v)) {
          if (sv == null) continue;
          if (sk.startsWith('--')) el.style.setProperty(sk, sv);
          else el.style[sk] = sv;
        }
      } else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (!(el instanceof SVGElement) && k in el && k !== 'list' && k !== 'form') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  appendKids(el, kids);
  return el;
}

function appendKids(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : String(k));
  }
  return el;
}

function h(tag, props, ...kids) { return build(document.createElement(tag), props, kids); }
function s(tag, props, ...kids) { return build(document.createElementNS(SVGNS, tag), props, kids); }

function svgEl(markup) {
  const t = document.createElement('template');
  t.innerHTML = markup.trim();
  return t.content.firstElementChild;
}

function icon(name, cls) {
  const markup = ICONS[name];
  if (!markup) return null;
  const el = svgEl(markup);
  if (cls) el.setAttribute('class', cls);
  return el;
}

function localPoint(e, el) {
  const r = el.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function rectOf(el, root) {
  const r = el.getBoundingClientRect();
  const o = root ? root.getBoundingClientRect() : { left: 0, top: 0 };
  return { x: r.left - o.left, y: r.top - o.top, w: r.width, h: r.height };
}

const inRect = (p, r, pad = 0) => p.x >= r.x - pad && p.x <= r.x + r.w + pad && p.y >= r.y - pad && p.y <= r.y + r.h + pad;

// A canvas sized to its box at device resolution; draw in CSS pixels.
function hiCanvas(cls) {
  const c = h('canvas', { class: cls || '' });
  c.fit = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const w = c.clientWidth;
    const hh = c.clientHeight;
    if (!w || !hh) return false;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(hh * dpr)) {
      c.width = Math.round(w * dpr);
      c.height = Math.round(hh * dpr);
    }
    c.cw = w;
    c.ch = hh;
    c.ctx = c.getContext('2d');
    c.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return true;
  };
  return c;
}

// ---------------------------------------------------------------- maths and colour
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const byte = (x) => clamp(Math.trunc(x * 255), 0, 255);
const hex2 = (n) => n.toString(16).padStart(2, '0');

// Console colours arrive as { r, g, b, a } floats. Converted like the Android app: trunc(c * 255).
function tintHex(c) {
  if (!c) return null;
  return `#${hex2(byte(c.r))}${hex2(byte(c.g))}${hex2(byte(c.b))}`;
}
const isBlackTint = (c) => !c || (byte(c.r) === 0 && byte(c.g) === 0 && byte(c.b) === 0);

function hexRgb(hex) {
  const v = hex.replace('#', '');
  const n = parseInt(v.length === 3 ? v.split('').map((ch) => ch + ch).join('') : v.slice(-6), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgbHex = (r, g, b) => `#${hex2(clamp(Math.trunc(r), 0, 255))}${hex2(clamp(Math.trunc(g), 0, 255))}${hex2(clamp(Math.trunc(b), 0, 255))}`;

function blend(a, b, t) {
  const x = hexRgb(a);
  const y = hexRgb(b);
  return rgbHex(lerp(x[0], y[0], t), lerp(x[1], y[1], t), lerp(x[2], y[2], t));
}
function shade(hex, f) {
  const [r, g, b] = hexRgb(hex);
  return rgbHex(r * f, g * f, b * f);
}
function rgba(hex, a) {
  const [r, g, b] = hexRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}
function hsv(hue, sat, val, alpha = 1) {
  const f = (n) => {
    const k = (n + hue / 60) % 6;
    return val - val * sat * Math.max(0, Math.min(k, 4 - k, 1));
  };
  return `rgba(${Math.round(f(5) * 255)},${Math.round(f(3) * 255)},${Math.round(f(1) * 255)},${alpha})`;
}

// ---------------------------------------------------------------- ids and storage
function hexId(bytes) {
  const a = new Uint8Array(bytes);
  crypto.getRandomValues(a);
  return Array.from(a, hex2).join('');
}
function uuid() {
  const x = hexId(16).split('');
  x[12] = '4';
  x[16] = '89ab'[parseInt(x[16], 16) & 3];
  const v = x.join('');
  return `${v.slice(0, 8)}-${v.slice(8, 12)}-${v.slice(12, 16)}-${v.slice(16, 20)}-${v.slice(20)}`;
}

const store = {
  get(key, fallback = null) {
    try {
      const v = localStorage.getItem(`kip.${key}`);
      return v == null ? fallback : JSON.parse(v);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      if (value == null) localStorage.removeItem(`kip.${key}`);
      else localStorage.setItem(`kip.${key}`, JSON.stringify(value));
    } catch { /* private mode */ }
  },
};

function deviceUid() {
  let id = store.get('uid');
  if (!id || !/^[0-9a-f]{16}$/.test(id)) {
    id = hexId(8);
    store.set('uid', id);
  }
  return id;
}

const shortType = (t) => String(t || '').replace(/^.*\./, '');

function b64ToBlobUrl(b64, type = 'image/jpeg') {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type }));
}

// ---------------------------------------------------------------- per-screen lifetime
// Everything a screen schedules goes through its scope, so leaving the screen stops it.
class Scope {
  constructor() {
    this.fns = [];
    this.alive = true;
  }
  add(fn) { this.fns.push(fn); }
  timeout(fn, ms) {
    const id = setTimeout(() => { if (this.alive) fn(); }, Math.max(0, ms));
    this.add(() => clearTimeout(id));
    return id;
  }
  interval(fn, ms) {
    const id = setInterval(() => { if (this.alive) fn(); }, ms);
    this.add(() => clearInterval(id));
    return id;
  }
  // fn(dtMs, now) runs every frame until it returns false or the scope ends.
  loop(fn) {
    let id = 0;
    let last = performance.now();
    let stopped = false;
    const tick = (t) => {
      if (!this.alive || stopped) return;
      const dt = Math.min(64, t - last);
      last = t;
      if (fn(dt, t) === false) return;
      id = requestAnimationFrame(tick);
    };
    id = requestAnimationFrame(tick);
    const stop = () => { stopped = true; cancelAnimationFrame(id); };
    this.add(stop);
    return stop;
  }
  on(target, ev, fn, opts) {
    target.addEventListener(ev, fn, opts);
    this.add(() => target.removeEventListener(ev, fn, opts));
  }
  resize(el, fn) {
    if (typeof ResizeObserver === 'undefined') {
      this.on(window, 'resize', () => fn());
      this.timeout(fn, 0);
      return;
    }
    const ro = new ResizeObserver(() => { if (this.alive) fn(); });
    ro.observe(el);
    this.add(() => ro.disconnect());
  }
  dispose() {
    this.alive = false;
    for (const fn of this.fns.splice(0).reverse()) {
      try { fn(); } catch (e) { console.error(e); }
    }
  }
}

// Pointer drag with capture. start(p, e) returns false to ignore the gesture.
function onDrag(scope, el, { start, move, end, relativeTo }) {
  let active = null;
  const ref = relativeTo || el;
  scope.on(el, 'pointerdown', (e) => {
    if (active !== null) return;
    const p = localPoint(e, ref);
    if (start && start(p, e) === false) return;
    active = e.pointerId;
    try { el.setPointerCapture(e.pointerId); } catch { /* old browsers */ }
    e.preventDefault();
  });
  scope.on(el, 'pointermove', (e) => {
    if (e.pointerId !== active) return;
    if (move) move(localPoint(e, ref), e);
  });
  const finish = (e, cancelled) => {
    if (e.pointerId !== active) return;
    active = null;
    if (end) end(localPoint(e, ref), cancelled, e);
  };
  scope.on(el, 'pointerup', (e) => finish(e, false));
  scope.on(el, 'pointercancel', (e) => finish(e, true));
}

function wrapLines(ctx, text, maxWidth) {
  const out = [];
  for (const para of String(text).split('\n')) {
    const words = para.split(/\s+/).filter(Boolean);
    let line = '';
    for (const w of words) {
      const test = line ? `${line} ${w}` : w;
      if (ctx.measureText(test).width <= maxWidth || !line) line = test;
      else {
        out.push(line);
        line = w;
      }
    }
    out.push(line);
  }
  return out;
}

// Largest font size (<= max) at which text wraps inside w x h.
function fitFont(ctx, text, w, hgt, max, min = 10, weight = 800) {
  let size = max;
  for (; size > min; size -= 1) {
    ctx.font = `${weight} ${size}px ${FONT}`;
    const lines = wrapLines(ctx, text, w);
    const widest = Math.max(...lines.map((l) => ctx.measureText(l).width));
    if (lines.length * size * 1.15 <= hgt && widest <= w) break;
  }
  ctx.font = `${weight} ${size}px ${FONT}`;
  return { size, lines: wrapLines(ctx, text, w) };
}

const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font') || 'system-ui, sans-serif';

// Shrinks an element's font until its text fits its box.
function fitText(el, max, min = 10) {
  let size = max;
  el.style.fontSize = `${size}px`;
  while (size > min && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) {
    size -= 1;
    el.style.fontSize = `${size}px`;
  }
}

function roundRect(ctx, x, y, w, hh, r) {
  const rr = Math.min(r, w / 2, hh / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + hh, rr);
  ctx.arcTo(x + w, y + hh, x, y + hh, rr);
  ctx.arcTo(x, y + hh, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

let toastTimer = 0;
function toast(text, ms = 2600) {
  let el = document.querySelector('.toast');
  if (!el) {
    el = h('div', { class: 'toast' });
    document.body.append(el);
  }
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// Sound effects synthesised with WebAudio, so the page needs no audio files.
const Sound = (() => {
  let ac = null;
  let master = null;
  let noiseBuf = null;
  let muted = store.get('muted', false);

  function ensure() {
    if (ac) {
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      return ac;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.55;
    master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ac;
  }

  // iOS only plays audio after a sound is started inside a user gesture.
  function unlock() {
    if (!ensure()) return;
    const src = ac.createBufferSource();
    src.buffer = ac.createBuffer(1, 1, 22050);
    src.connect(master);
    src.start(0);
  }

  function env(g, t0, attack, dur, vol) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }

  function tone({ type = 'sine', f = 440, f2 = null, t = 0, d = 0.15, v = 0.25, attack = 0.005 }) {
    const t0 = ac.currentTime + t;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    env(g, t0, attack, d, v);
    o.connect(g).connect(master);
    o.start(t0);
    o.stop(t0 + d + 0.05);
  }

  function noise({ t = 0, d = 0.2, v = 0.25, type = 'bandpass', f = 1200, f2 = null, q = 1, attack = 0.004 }) {
    const t0 = ac.currentTime + t;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const filt = ac.createBiquadFilter();
    filt.type = type;
    filt.frequency.setValueAtTime(f, t0);
    if (f2) filt.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    filt.Q.value = q;
    const g = ac.createGain();
    env(g, t0, attack, d, v);
    src.connect(filt).connect(g).connect(master);
    src.start(t0, Math.random() * 0.5);
    src.stop(t0 + d + 0.05);
  }

  const fx = {
    tap: () => tone({ type: 'triangle', f: 620, f2: 900, d: 0.07, v: 0.18 }),
    select: () => { tone({ type: 'triangle', f: 523, d: 0.09, v: 0.22 }); tone({ type: 'triangle', f: 784, t: 0.07, d: 0.14, v: 0.22 }); },
    correct: () => [523, 659, 784, 1047].forEach((f, i) => tone({ type: 'triangle', f, t: i * 0.06, d: 0.2, v: 0.2 })),
    wrong: () => { tone({ type: 'sawtooth', f: 240, f2: 120, d: 0.32, v: 0.14 }); tone({ type: 'square', f: 180, f2: 90, t: 0.04, d: 0.3, v: 0.06 }); },
    link: () => tone({ type: 'sine', f: 700, f2: 1400, d: 0.12, v: 0.2 }),
    snap: () => { tone({ type: 'triangle', f: 880, d: 0.06, v: 0.2 }); noise({ f: 3000, d: 0.05, v: 0.12 }); },
    crack: () => { noise({ f: 3800, q: 2, d: 0.08, v: 0.35 }); tone({ type: 'square', f: 1800, f2: 900, d: 0.04, v: 0.05 }); },

    zip: () => noise({ type: 'bandpass', f: 2200, f2: 5200, q: 6, d: 0.09, v: 0.2 }),
    unzip: () => { noise({ type: 'bandpass', f: 1800, f2: 6000, q: 5, d: 0.25, v: 0.25 }); tone({ type: 'triangle', f: 660, f2: 990, t: 0.2, d: 0.12, v: 0.12 }); },
    boom: () => { noise({ type: 'lowpass', f: 1400, f2: 80, q: 0.7, d: 0.7, v: 0.6, attack: 0.002 }); tone({ type: 'sine', f: 120, f2: 35, d: 0.6, v: 0.45 }); },
    unlock: () => { tone({ type: 'square', f: 1250, d: 0.03, v: 0.08 }); tone({ type: 'square', f: 1650, t: 0.05, d: 0.05, v: 0.08 }); noise({ t: 0.03, f: 4000, d: 0.06, v: 0.15 }); },
    chains: () => { for (let i = 0; i < 5; i++) noise({ t: i * 0.05, f: rand(3000, 5000), q: 8, d: 0.08, v: 0.15 }); },
    squash: () => { noise({ type: 'lowpass', f: 1200, f2: 200, d: 0.12, v: 0.4 }); tone({ type: 'square', f: 220, f2: 70, d: 0.1, v: 0.08 }); },
    buzz: () => tone({ type: 'sawtooth', f: 140, f2: 150, d: 0.18, v: 0.07 }),
    tick: () => tone({ type: 'square', f: 1400, d: 0.02, v: 0.06 }),
    whoosh: () => noise({ type: 'bandpass', f: 400, f2: 2400, q: 1.2, d: 0.3, v: 0.25 }),
    reveal: () => { tone({ type: 'triangle', f: 784, d: 0.1, v: 0.2 }); tone({ type: 'triangle', f: 1175, t: 0.08, d: 0.25, v: 0.2 }); },
    light: () => tone({ type: 'sine', f: 900 + Math.random() * 300, d: 0.06, v: 0.1 }),
    go: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone({ type: 'square', f, t: i * 0.07, d: 0.16, v: 0.08 })),
    fanfare: () => { [523, 659, 784].forEach((f, i) => tone({ type: 'triangle', f, t: i * 0.11, d: 0.22, v: 0.2 })); tone({ type: 'triangle', f: 1047, t: 0.33, d: 0.5, v: 0.22 }); },
    scroll: () => { noise({ type: 'bandpass', f: 900, f2: 300, q: 0.8, d: 0.45, v: 0.18 }); tone({ type: 'triangle', f: 660, t: 0.35, d: 0.3, v: 0.12 }); },
    power: () => { tone({ type: 'sawtooth', f: 200, f2: 800, d: 0.3, v: 0.08 }); tone({ type: 'triangle', f: 800, t: 0.25, d: 0.3, v: 0.15 }); },
    disco: () => { tone({ type: 'square', f: 110, d: 0.08, v: 0.08 }); noise({ t: 0.1, type: 'highpass', f: 7000, d: 0.04, v: 0.1 }); },
  };

  function play(name) {
    if (muted || !ensure()) return;
    try { fx[name]?.(); } catch (e) { console.warn('sound', name, e); }
  }

  function vibrate(pattern) {
    if (muted || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch { /* not allowed */ }
  }

  return {
    play,
    unlock,
    vibrate,
    get muted() { return muted; },
    setMuted(m) {
      muted = !!m;
      store.set('muted', muted);
    },
  };
})();

// WebSocket link to the relay. It reconnects by itself; the relay keeps the game
// connection to the console open while the phone is away and replays what was missed.
const Net = (() => {
  let ws = null;
  let open = false;
  let retry = 0;
  let retryTimer = 0;
  let lastPong = 0;
  let pingTimer = 0;
  const listeners = new Set();
  let queue = [];
  let gameReady = false;

  function relayAddress() {
    const q = new URLSearchParams(location.search).get('relay');
    if (q) {
      store.set('relay', q);
      return q;
    }
    if (/^https?:$/.test(location.protocol) && location.host) return location.host;
    return store.get('relay');
  }

  function wsUrl() {
    const addr = relayAddress();
    if (!addr) return null;
    const clean = String(addr).replace(/^(https?|wss?):\/\//, '').replace(/\/.*$/, '');
    const secure = location.protocol === 'https:' && clean === location.host;
    return `${secure ? 'wss' : 'ws'}://${clean}/ws`;
  }

  function emit(ev) {
    for (const fn of listeners) {
      try { fn(ev); } catch (e) { console.error(e); }
    }
  }

  function connect() {
    clearTimeout(retryTimer);
    const url = wsUrl();
    if (!url) {
      emit({ op: 'norelay' });
      return;
    }
    if (ws) drop();
    let sock;
    try {
      sock = new WebSocket(url);
    } catch (e) {
      emit({ op: 'neterror', error: String(e.message || e) });
      schedule();
      return;
    }
    ws = sock;
    sock.startedAt = Date.now();
    sock.onopen = () => {
      if (ws !== sock) return;
      open = true;
      retry = 0;
      lastPong = Date.now();
      emit({ op: 'open' });
    };
    sock.onmessage = (e) => {
      if (ws !== sock) return;
      lastPong = Date.now();
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.op === 'pong') return;
      emit(msg);
    };
    sock.onclose = () => {
      if (ws !== sock) return;
      lost();
    };
    sock.onerror = () => {};
  }

  function drop() {
    const old = ws;
    ws = null;
    open = false;
    gameReady = false;
    if (old) {
      old.onopen = old.onmessage = old.onclose = old.onerror = null;
      try { old.close(); } catch { /* already closed */ }
    }
  }

  function lost() {
    const wasOpen = open;
    drop();
    emit({ op: 'closed', wasOpen });
    schedule();
  }

  function schedule() {
    clearTimeout(retryTimer);
    const delay = Math.min(5000, 500 * 2 ** Math.min(retry, 4));
    retry++;
    retryTimer = setTimeout(connect, document.hidden ? Math.max(delay, 3000) : delay);
  }

  function raw(obj) {
    if (!ws || !open) return false;
    try {
      ws.send(JSON.stringify(obj));
      return true;
    } catch {
      return false;
    }
  }

  // Game messages wait in a queue while the link is down and go out once the
  // relay has replayed the session, as long as they are not stale.
  function enqueue(item) {
    if (gameReady && raw(item)) return;
    queue.push({ item, at: Date.now() });
  }

  function flush() {
    const now = Date.now();
    const pending = queue;
    queue = [];
    for (const q of pending) {
      if (now - q.at > 15000) continue;
      if (!raw(q.item)) queue.push(q);
    }
  }

  function heartbeat() {
    clearInterval(pingTimer);
    pingTimer = setInterval(() => {
      if (!ws) return;
      if (!open && Date.now() - ws.startedAt > 8000) {
        lost();
        return;
      }
      if (open && Date.now() - lastPong > 25000) {
        lost();
        return;
      }
      raw({ op: 'ping', t: Date.now() });
    }, 8000);
  }

  // Phones freeze pages in the background and the socket often dies silently.
  function wake() {
    if (document.hidden) return;
    if (ws && !open && Date.now() - ws.startedAt < 6000) return;
    if (!ws || !open) {
      retry = 0;
      connect();
      return;
    }
    const before = lastPong;
    raw({ op: 'ping', t: Date.now() });
    setTimeout(() => {
      if (ws && lastPong === before) lost();
    }, 2500);
  }

  document.addEventListener('visibilitychange', wake);
  window.addEventListener('pageshow', wake);
  window.addEventListener('online', wake);

  return {
    start() {
      heartbeat();
      connect();
    },
    reconnect() {
      retry = 0;
      connect();
    },
    on(fn) {
      listeners.add(fn);
      return () => listeners.delete(fn);
    },
    get open() { return open; },
    get address() { return relayAddress(); },
    setAddress(addr) {
      store.set('relay', addr);
      retry = 0;
      connect();
    },
    raw,
    game(m) { enqueue({ op: 'send', m }); },
    image(guid, transferId, data) { enqueue({ op: 'image', guid, transferId, imgType: 2, data }); },
    setGameReady(ready) {
      gameReady = ready;
      if (ready) flush();
    },
    clearQueue() { queue = []; },
    pendingGame() {
      const now = Date.now();
      return queue.filter((q) => q.item.op === 'send' && now - q.at <= 15000).map((q) => q.item.m);
    },
  };
})();

// Backgrounds shared by most screens: the 24-ray sunburst and the whirlpool spiral.
function sunburst(primary = '#C4B8A8', secondary = '#D4C8B8') {
  const rays = h('div', { class: 'sunburst' });
  const wrap = h('div', { class: 'sunburst-wrap' }, rays);
  wrap.setColors = (a, b) => {
    rays.style.setProperty('--sb1', a);
    rays.style.setProperty('--sb2', b);
  };
  wrap.setColors(primary, secondary);
  return wrap;
}

let whirlPath = null;
function whirlpool() {
  if (!whirlPath) {
    const maxR = 38;
    const maxHalf = maxR * 0.15;
    const rotations = 3.5;
    const points = Math.round(rotations * 120);
    const parts = [];
    for (const phase of [0, Math.PI]) {
      const outer = [];
      const inner = [];
      for (let i = 0; i <= points; i++) {
        const t = i / points;
        const a = phase + t * rotations * Math.PI * 2;
        const r = t * maxR;
        const hw = t * maxHalf;
        outer.push(`${((r + hw) * Math.cos(a)).toFixed(2)},${((r + hw) * Math.sin(a)).toFixed(2)}`);
        inner.push(`${((r - hw) * Math.cos(a)).toFixed(2)},${((r - hw) * Math.sin(a)).toFixed(2)}`);
      }
      parts.push(`M${outer.join('L')}L${inner.reverse().join('L')}Z`);
    }
    whirlPath = parts.join('');
  }
  const el = s('svg', { class: 'whirlpool', viewBox: '-50 -50 100 100', preserveAspectRatio: 'xMidYMid meet' },
    s('path', { d: whirlPath, fill: 'rgba(255,255,255,0.19)' }));
  return el;
}

function feedbackBubble() {
  const top = h('div');
